<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raphael</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-darkest: #1e1f22;
      --bg-darker: #2b2d31;
      --bg-main: #313338;
      --bg-input: #383a40;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --green: #23a559;
      --red: #da373c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-main); color: var(--text-normal); height: 100vh; overflow: hidden; }
    button { cursor: pointer; border: none; border-radius: 4px; padding: 8px 14px; font-weight: 600; background: var(--brand); color: #fff; }
    button:hover { background: var(--brand-hover); }
    button.secondary { background: #4e5058; }
    button.danger { background: var(--red); }
    input { background: var(--bg-darkest); border: 1px solid #1e1f22; color: var(--text-normal); padding: 10px; border-radius: 4px; width: 100%; outline: none; }

    #auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-darkest); padding: 16px; }
    .auth-box { background: var(--bg-main); padding: 28px; border-radius: 8px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .auth-logo { width: 48px; height: 48px; background: var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin: 0 auto; }
    .auth-box h1 { text-align: center; font-size: 22px; }
    .auth-box p { text-align: center; color: var(--text-muted); font-size: 14px; }
    .link-text { color: #00a8fc; font-size: 13px; cursor: pointer; text-align: center; }

    #app-screen { display: none; height: 100vh; grid-template-columns: 72px 240px 1fr 240px; }
    @media (max-width: 768px) {
      #app-screen { grid-template-columns: 60px 1fr; }
      .sidebar, .right-sidebar { display: none; }
      .sidebar.open, .right-sidebar.open { display: flex; position: fixed; top: 0; bottom: 0; z-index: 50; width: 260px; }
      .sidebar.open { left: 60px; }
      .right-sidebar.open { right: 0; }
    }

    .server-bar { background: var(--bg-darkest); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 8px; }
    .server-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-main); display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .server-icon:hover, .server-icon.active { border-radius: 16px; background: var(--brand); color: #fff; }
    .server-icon.add { color: var(--green); font-size: 24px; }

    .sidebar { background: var(--bg-darker); display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #1f2023; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { flex: 1; padding: 12px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .channel-item { padding: 8px 10px; border-radius: 4px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .channel-item:hover, .channel-item.active { background: #3f4147; color: #fff; }

    .voice-panel { background: #232428; padding: 10px; border-top: 1px solid #1f2023; font-size: 12px; }
    .voice-controls { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .voice-controls button { padding: 5px 8px; font-size: 11px; flex: 1; }

    .user-panel { background: #232428; padding: 10px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: bold; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .chat-area { display: flex; flex-direction: column; background: var(--bg-main); height: 100vh; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid #1f2023; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { display: flex; gap: 12px; }
    .msg-body h4 { font-size: 14px; margin-bottom: 2px; }
    .msg-body h4 span { font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 6px; }
    .msg-body p { font-size: 15px; line-height: 1.4; }

    .typing-bar { height: 24px; padding: 0 16px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
    .dots { display: inline-flex; gap: 3px; }
    .dots span { width: 5px; height: 5px; background: var(--text-normal); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .dots span:nth-child(1) { animation-delay: -0.32s; }
    .dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    .chat-input-wrap { padding: 0 16px 16px; }
    .chat-input-box { background: var(--bg-input); border-radius: 8px; padding: 8px 12px; display: flex; gap: 8px; }
    .chat-input-box input { background: transparent; border: none; padding: 6px; }

    .right-sidebar { background: var(--bg-darker); padding: 16px; border-left: 1px solid #1f2023; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .section-title { font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal { background: var(--bg-main); padding: 24px; border-radius: 8px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .perm-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #3f4147; font-size: 14px; }
    .perm-row input[type="checkbox"] { width: auto; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-logo">R</div>
      <h1 id="auth-title">Raphael にログイン</h1>
      <p id="auth-subtitle">おかえりなさい！</p>
      <div id="username-wrap" style="display:none;">
        <label style="font-size:12px; color:#b5bac1;">ユーザー名</label>
        <input type="text" id="auth-username" placeholder="表示される名前" />
      </div>
      <div>
        <label style="font-size:12px; color:#b5bac1;">メールアドレス</label>
        <input type="email" id="auth-email" placeholder="example@mail.com" />
      </div>
      <div>
        <label style="font-size:12px; color:#b5bac1;">パスワード</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>
      <button id="auth-submit-btn">ログイン</button>
      <div class="link-text" id="auth-toggle-btn">アカウント登録はこちら</div>
    </div>
  </div>

  <div id="app-screen">
    <div class="server-bar" id="server-list">
      <div class="server-icon active" data-server="dm" title="ダイレクトメッセージ">R</div>
      <div class="server-icon add" id="open-server-modal" title="サーバーを作成・参加">+</div>
    </div>

    <div class="sidebar" id="left-sidebar">
      <div class="sidebar-header">
        <span id="current-server-name">ダイレクトメッセージ</span>
        <span style="cursor:pointer;" id="open-role-modal" title="サーバー設定">⚙</span>
      </div>
      <div class="sidebar-content" id="channel-list">
        <div class="channel-item active" data-channel="general"># 一般チャット</div>
        <div class="channel-item" data-channel="random"># 雑談</div>
      </div>

      <div class="voice-panel">
        <div style="color:var(--green); font-weight:bold;">● ボイス＆画面共有チャンネル</div>
        <div id="voice-status" style="color:var(--text-muted); margin-top:2px;">未接続</div>
        <div class="voice-controls">
          <button id="btn-join-voice" style="background:var(--green);">通話に参加</button>
          <button id="btn-mute" class="secondary">🎤 ミュート</button>
          <button id="btn-share" class="secondary">🖥 画面共有</button>
          <button id="btn-leave-voice" class="danger">切断</button>
        </div>
      </div>

      <div class="user-panel">
        <div class="user-info">
          <div class="avatar" id="my-avatar">R</div>
          <div>
            <div id="my-display-name" style="font-size:14px; font-weight:bold;">ユーザー</div>
            <div id="my-tag" style="font-size:11px; color:var(--text-muted);">#0000</div>
          </div>
        </div>
        <span style="cursor:pointer;" id="open-profile-modal" title="プロフィール編集">⚙</span>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="secondary" onclick="document.getElementById('left-sidebar').classList.toggle('open')">☰</button>
          <strong id="current-channel-title"># 一般チャット</strong>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button class="secondary" onclick="document.getElementById('right-sidebar').classList.toggle('open')">👥</button>
          <button class="secondary" id="btn-call-dm">📞 通話</button>
          <button class="secondary" id="btn-invite">招待</button>
          <button class="danger" id="btn-logout">ログアウト</button>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages"></div>

      <div class="typing-bar" id="typing-indicator" style="visibility: hidden;">
        <div class="dots"><span></span><span></span><span></span></div>
        <span id="typing-text"></span>
      </div>

      <div class="chat-input-wrap">
        <div class="chat-input-box">
          <input type="text" id="message-input" placeholder="メッセージを送信..." />
          <button id="send-msg-btn">送信</button>
        </div>
      </div>
    </div>

    <div class="right-sidebar" id="right-sidebar">
      <div>
        <div class="section-title">フレンドを追加</div>
        <p style="font-size:11px; color:var(--text-muted); margin-bottom:6px;">
          相手の「ユーザー名#4桁コード」を入力（あなたのID: <span id="my-full-id"></span>）
        </p>
        <input type="text" id="friend-input" placeholder="例: 太郎#1234" style="margin-bottom:6px;" />
        <button id="send-friend-btn" style="width:100%;">申請送信</button>
      </div>
      <div>
        <div class="section-title">保留中の申請</div>
        <div id="pending-friends" style="font-size:13px; color:var(--text-muted);">なし</div>
      </div>
      <div>
        <div class="section-title">フレンド一覧（オンライン状況）</div>
        <div id="friend-list" style="display:flex; flex-direction:column; gap:6px; font-size:14px;">
          <div>● オンラインユーザー</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="server-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>サーバーを作成・参加</h3>
        <button class="secondary" onclick="closeModals()">閉じる</button>
      </div>
      <div>
        <label style="font-size:12px;">新規サーバー作成</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="text" id="new-server-name" placeholder="サーバー名" />
          <button id="create-server-btn">作成</button>
        </div>
      </div>
      <div>
        <label style="font-size:12px;">招待コードで参加</label>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <input type="text" id="invite-code-input" placeholder="招待コード" />
          <button id="join-server-btn">参加</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="profile-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>プロフィール編集</h3>
      </div>
      <label style="font-size:12px;">画像を選択</label>
      <input type="file" id="profile-img-input" accept="image/*" />
      <label style="font-size:12px;">表示名</label>
      <input type="text" id="profile-name-input" />
      <label style="font-size:12px;">アイコン背景色</label>
      <input type="color" id="profile-color-input" value="#5865f2" style="height:40px;" />
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
        <button class="secondary" onclick="closeModals()">キャンセル</button>
        <button id="save-profile-btn">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="role-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>サーバー設定（ロール・権限）</h3>
        <button class="secondary" onclick="closeModals()">✕</button>
      </div>
      <label style="font-size:12px;">新しいロールを作成</label>
      <div style="display:flex; gap:6px;">
        <input type="text" id="role-name-input" placeholder="ロール名（例：管理者）" />
        <input type="color" id="role-color-input" value="#e91e63" style="width:50px; padding:2px;" />
      </div>
      <div class="perm-row"><span>メッセージ送信</span><input type="checkbox" checked /></div>
      <div class="perm-row"><span>メッセージ削除</span><input type="checkbox" /></div>
      <div class="perm-row"><span>ロール管理</span><input type="checkbox" /></div>
      <div class="perm-row"><span>メンバー追放</span><input type="checkbox" /></div>
      <button id="add-role-btn">ロール追加</button>
      <div class="section-title" style="margin-top:8px;">作成済みロール</div>
      <div id="role-list" style="font-size:13px; color:var(--text-muted);">デフォルトロール</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'あなたのSUPABASE_URL';
    const SUPABASE_ANON_KEY = 'あなたのSUPABASE_ANON_KEY';
    const sb = (SUPABASE_URL.startsWith('http')) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let isRegisterMode = false;
    let currentUser = JSON.parse(localStorage.getItem('raphael_user')) || null;
    let currentChannel = 'general';
    let typingTimer = null;
    let isTyping = false;

    document.getElementById('auth-toggle-btn').onclick = () => {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').textContent = isRegisterMode ? 'Raphael アカウント作成' : 'Raphael にログイン';
      document.getElementById('username-wrap').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('auth-submit-btn').textContent = isRegisterMode ? '登録する' : 'ログイン';
      document.getElementById('auth-toggle-btn').textContent = isRegisterMode ? 'すでにアカウントをお持ちの方はこちら' : 'アカウント登録はこちら';
    };

    document.getElementById('auth-submit-btn').onclick = () => {
      const email = document.getElementById('auth-email').value.trim();
      const uname = document.getElementById('auth-username').value.trim() || email.split('@')[0] || 'ユーザー';
      if (!email) return alert('メールアドレスを入力してください');

      const tag = '#' + Math.floor(1000 + Math.random() * 9000);
      currentUser = {
        id: 'u_' + Date.now(),
        username: uname,
        tag: tag,
        color: '#5865f2',
        avatar: ''
      };
      localStorage.setItem('raphael_user', JSON.stringify(currentUser));
      initApp();
    };

    function initApp() {
      if (!currentUser) return;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'grid';
      updateProfileUI();
      setupRealtimeTyping();
    }

    function updateProfileUI() {
      document.getElementById('my-display-name').textContent = currentUser.username;
      document.getElementById('my-tag').textContent = currentUser.tag;
      document.getElementById('my-full-id').textContent = currentUser.username + currentUser.tag;
      const av = document.getElementById('my-avatar');
      av.style.background = currentUser.color;
      av.innerHTML = currentUser.avatar ? `<img src="${currentUser.avatar}">` : currentUser.username[0].toUpperCase();
    }

    document.getElementById('btn-logout').onclick = () => {
      localStorage.removeItem('raphael_user');
      location.reload();
    };

    const msgInput = document.getElementById('message-input');
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      clearTimeout(typingTimer);
      isTyping = false;
      sendTypingState(false);

      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `
        <div class="avatar" style="background:${currentUser.color}">${currentUser.username[0].toUpperCase()}</div>
        <div class="msg-body">
          <h4>${currentUser.username} <span>${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></h4>
          <p>${text.replace(/</g, '&lt;')}</p>
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      msgInput.value = '';
    }

    document.getElementById('send-msg-btn').onclick = sendMessage;
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    async function sendTypingState(typing) {
      if (!sb || !currentUser) return;
      if (typing) {
        await sb.from('typing_status').upsert({
          channel_id: currentChannel,
          user_id: currentUser.id,
          username: currentUser.username,
          updated_at: new Date().toISOString()
        }, { onConflict: 'channel_id,user_id' });
      } else {
        await sb.from('typing_status').delete().match({
          channel_id: currentChannel,
          user_id: currentUser.id
        });
      }
    }

    msgInput.addEventListener('input', () => {
      if (msgInput.value.trim() === '') {
        clearTimeout(typingTimer);
        isTyping = false;
        sendTypingState(false);
        return;
      }
      if (!isTyping) {
        isTyping = true;
        sendTypingState(true);
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        isTyping = false;
        sendTypingState(false);
      }, 3000);
    });

    async function fetchTypingUsers() {
      if (!sb) return;
      const limitTime = new Date(Date.now() - 5000).toISOString();
      const { data } = await sb.from('typing_status')
        .select('user_id, username')
        .eq('channel_id', currentChannel)
        .gt('updated_at', limitTime);

      const indicator = document.getElementById('typing-indicator');
      const textEl = document.getElementById('typing-text');
      if (!data) return;

      const others = data.filter(u => u.user_id !== currentUser.id).map(u => u.username);
      if (others.length === 0) {
        indicator.style.visibility = 'hidden';
      } else {
        indicator.style.visibility = 'visible';
        textEl.innerHTML = `<strong>${others.join(', ')}</strong> さんが入力中...`;
      }
    }

    function setupRealtimeTyping() {
      if (!sb) return;
      sb.channel('raphael-typing')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'typing_status' }, fetchTypingUsers)
        .subscribe();
      setInterval(fetchTypingUsers, 2000);
    }

    document.querySelectorAll('.channel-item').forEach(el => {
      el.onclick = () => {
        document.querySelectorAll('.channel-item').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentChannel = el.dataset.channel;
        document.getElementById('current-channel-title').textContent = el.textContent;
        document.getElementById('left-sidebar').classList.remove('open');
        fetchTypingUsers();
      };
    });

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
    }
    document.getElementById('open-server-modal').onclick = () => document.getElementById('server-modal').style.display = 'flex';
    document.getElementById('open-profile-modal').onclick = () => {
      document.getElementById('profile-name-input').value = currentUser.username;
      document.getElementById('profile-color-input').value = currentUser.color;
      document.getElementById('profile-modal').style.display = 'flex';
    };
    document.getElementById('open-role-modal').onclick = () => document.getElementById('role-modal').style.display = 'flex';

    document.getElementById('save-profile-btn').onclick = () => {
      currentUser.username = document.getElementById('profile-name-input').value.trim() || currentUser.username;
      currentUser.color = document.getElementById('profile-color-input').value;
      const file = document.getElementById('profile-img-input').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          currentUser.avatar = e.target.result;
          localStorage.setItem('raphael_user', JSON.stringify(currentUser));
          updateProfileUI();
          closeModals();
        };
        reader.readAsDataURL(file);
      } else {
        localStorage.setItem('raphael_user', JSON.stringify(currentUser));
        updateProfileUI();
        closeModals();
      }
    };

    document.getElementById('create-server-btn').onclick = () => {
      const name = document.getElementById('new-server-name').value.trim();
      if (!name) return;
      const icon = document.createElement('div');
      icon.className = 'server-icon';
      icon.textContent = name[0].toUpperCase();
      icon.onclick = () => {
        document.getElementById('current-server-name').textContent = name;
      };
      document.getElementById('server-list').insertBefore(icon, document.getElementById('open-server-modal'));
      closeModals();
    };

    document.getElementById('add-role-btn').onclick = () => {
      const rName = document.getElementById('role-name-input').value.trim();
      const rColor = document.getElementById('role-color-input').value;
      if (!rName) return;
      const item = document.createElement('div');
      item.style.color = rColor;
      item.textContent = '● ' + rName;
      document.getElementById('role-list').appendChild(item);
      document.getElementById('role-name-input').value = '';
    };

    document.getElementById('send-friend-btn').onclick = () => {
      const val = document.getElementById('friend-input').value.trim();
      if (!val.includes('#')) return alert('「ユーザー名#4桁コード」の形式で入力してください');
      document.getElementById('pending-friends').textContent = val + ' に申請中...';
      document.getElementById('friend-input').value = '';
    };

    document.getElementById('btn-join-voice').onclick = () => document.getElementById('voice-status').textContent = '通話接続中 🔊';
    document.getElementById('btn-leave-voice').onclick = () => document.getElementById('voice-status').textContent = '未接続';

    if (currentUser) initApp();
  </script>
</body>
</html>
