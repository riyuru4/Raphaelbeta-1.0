<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Raphael</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html, body { height: 100dvh; margin: 0; padding: 0; overflow: hidden; background: #313338; color: #dbdee1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 3px; }
</style>
</head>
<body class="flex flex-col">

<!-- 認証画面 -->
<div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1e1f22] p-4">
  <div class="w-full max-w-sm bg-[#313338] rounded-xl p-6 shadow-2xl">
    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-[#5865f2] flex items-center justify-center text-white font-bold text-2xl mb-3 shadow">R</div>
      <h1 class="text-xl font-bold text-white" id="auth-title">Raphael にログイン</h1>
      <p class="text-xs text-[#949ba4] mt-1">おかえりなさい！</p>
    </div>
    <div id="auth-error" class="hidden mb-4 p-2.5 rounded bg-red-500/20 border border-red-500 text-red-300 text-xs"></div>
    <div class="space-y-3">
      <div id="username-field" class="hidden">
        <label class="block text-xs font-bold text-[#b5bac1] mb-1">ユーザー名</label>
        <input id="auth-username" type="text" placeholder="表示名を入力" class="w-full px-3 py-2.5 rounded bg-[#1e1f22] text-white text-sm outline-none focus:ring-2 focus:ring-[#5865f2]">
      </div>
      <div>
        <label class="block text-xs font-bold text-[#b5bac1] mb-1">メールアドレス</label>
        <input id="auth-email" type="email" placeholder="example@email.com" class="w-full px-3 py-2.5 rounded bg-[#1e1f22] text-white text-sm outline-none focus:ring-2 focus:ring-[#5865f2]">
      </div>
      <div>
        <label class="block text-xs font-bold text-[#b5bac1] mb-1">パスワード</label>
        <input id="auth-password" type="password" placeholder="6文字以上" class="w-full px-3 py-2.5 rounded bg-[#1e1f22] text-white text-sm outline-none focus:ring-2 focus:ring-[#5865f2]">
      </div>
      <button onclick="handleAuth()" id="auth-submit-btn" class="w-full py-2.5 mt-2 rounded bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold text-sm transition">ログイン</button>
    </div>
    <p class="text-xs text-[#949ba4] mt-4 text-center">
      <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-[#00a8fc] hover:underline">アカウント登録はこちら</button>
    </p>
  </div>
</div>

<!-- メインアプリ -->
<div id="app-screen" class="hidden flex-1 flex h-full overflow-hidden relative">
  <!-- モバイル背景オーバーレイ -->
  <div id="drawer-overlay" onclick="toggleDrawer(false)" class="hidden fixed inset-0 bg-black/60 z-30 md:hidden"></div>

  <!-- 左ドロワー（サーバーバー + チャンネル/DM一覧） -->
  <div id="left-drawer" class="fixed md:static inset-y-0 left-0 z-40 flex h-full transform -translate-x-full md:translate-x-0 transition-transform duration-200">
    <!-- サーバー一覧バー -->
    <div class="w-[68px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2.5 shrink-0">
      <button onclick="selectHome()" id="home-btn" class="w-12 h-12 rounded-2xl bg-[#5865f2] text-white font-bold text-lg flex items-center justify-center shadow transition hover:rounded-xl">R</button>
      <div class="w-8 h-[2px] bg-[#35363c] rounded"></div>
      <div id="server-list" class="flex-1 flex flex-col items-center gap-2.5 overflow-y-auto w-full px-2"></div>
      <button onclick="openModal('server-modal')" class="w-12 h-12 rounded-3xl bg-[#313338] hover:bg-[#23a55a] text-[#23a55a] hover:text-white text-2xl flex items-center justify-center transition" title="サーバー追加・参加">+</button>
    </div>

    <!-- チャンネル / DM サイドバー -->
    <div class="w-60 bg-[#2b2d31] flex flex-col h-full">
      <div class="h-12 px-4 border-b border-[#1f2023] flex items-center justify-between shrink-0">
        <span id="sidebar-title" class="font-bold text-white truncate text-sm">ダイレクトメッセージ</span>
        <button id="server-settings-btn" onclick="openServerSettings()" class="hidden text-[#b5bac1] hover:text-white p-1" title="サーバー設定">⚙️</button>
      </div>
      <div id="sidebar-content" class="flex-1 scroll-area p-2 space-y-1"></div>
      <!-- プロフィールフッター -->
      <div class="h-14 bg-[#232428] px-2.5 flex items-center justify-between shrink-0">
        <div onclick="openProfileModal()" class="flex items-center gap-2 cursor-pointer hover:bg-[#35373c] p-1 rounded flex-1 min-w-0">
          <div class="relative shrink-0">
            <div id="my-avatar" class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center text-white font-bold text-xs overflow-hidden"></div>
            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-[#23a55a] ring-2 ring-[#232428]"></span>
          </div>
          <div class="min-w-0 flex-1">
            <div id="my-username" class="text-xs font-bold text-white truncate">ユーザー</div>
            <div id="my-code" class="text-[10px] text-[#949ba4] truncate">#0000</div>
          </div>
        </div>
        <button onclick="openProfileModal()" class="text-[#b5bac1] hover:text-white p-1.5" title="プロフィール編集">⚙️</button>
      </div>
    </div>
  </div>

  <!-- 右メインエリア -->
  <div class="flex-1 flex flex-col h-full min-w-0 bg-[#313338]">
    <!-- ヘッダー -->
    <div class="h-12 px-3 border-b border-[#1f2023] flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <button onclick="toggleDrawer(true)" class="md:hidden text-[#b5bac1] hover:text-white p-1.5 text-lg">☰</button>
        <span id="main-header-icon" class="text-[#80848e] font-bold">👥</span>
        <h2 id="main-header-title" class="font-bold text-white text-sm truncate">フレンド</h2>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="call-toggle-btn" onclick="toggleCallArea()" class="hidden px-2.5 py-1 rounded bg-[#23a55a] hover:bg-[#1a8245] text-white text-xs font-bold flex items-center gap-1">📞 通話</button>
        <button id="invite-btn" onclick="showInviteCode()" class="hidden px-2.5 py-1 rounded bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold">招待</button>
        <button onclick="logout()" class="px-2 py-1 rounded bg-[#da373c]/20 hover:bg-[#da373c] text-[#f23f43] hover:text-white text-xs">ログアウト</button>
      </div>
    </div>

    <!-- 通話・画面共有パネル -->
    <div id="call-panel" class="hidden bg-[#1e1f22] border-b border-[#111214] p-3 shrink-0">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-[#23a55a] flex items-center gap-1.5">● ボイス＆画面共有チャンネル</span>
        <div class="flex items-center gap-2">
          <button id="join-call-btn" onclick="joinCall()" class="px-3 py-1 rounded bg-[#23a55a] text-white text-xs font-bold">通話に参加</button>
          <button id="mic-btn" onclick="toggleMic()" class="hidden px-2.5 py-1 rounded bg-[#313338] text-white text-xs">🎤 ミュート</button>
          <button id="screen-btn" onclick="toggleScreenShare()" class="hidden px-2.5 py-1 rounded bg-[#5865f2] text-white text-xs">🖥️ 画面共有</button>
          <button id="leave-call-btn" onclick="leaveCall()" class="hidden px-2.5 py-1 rounded bg-[#da373c] text-white text-xs">切断</button>
        </div>
      </div>
      <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-64 overflow-y-auto"></div>
      <div id="remote-audios" class="hidden"></div>
    </div>

    <!-- フレンド画面 -->
    <div id="friends-view" class="flex-1 scroll-area p-4 space-y-5">
      <div class="bg-[#2b2d31] p-4 rounded-lg">
        <h3 class="text-xs font-bold text-white uppercase mb-1">フレンドを追加</h3>
        <p class="text-xs text-[#949ba4] mb-3">相手の「ユーザー名#4桁コード」を入力して申請します（あなたのID: <span id="my-full-id" class="text-white font-mono"></span>）</p>
        <div class="flex gap-2">
          <input id="friend-add-input" type="text" placeholder="例: ユーザー名#1234" class="flex-1 px-3 py-2 rounded bg-[#1e1f22] text-white text-sm outline-none">
          <button onclick="sendFriendRequest()" class="px-4 py-2 rounded bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold shrink-0">申請送信</button>
        </div>
      </div>
      <div>
        <h3 class="text-xs font-bold text-[#949ba4] uppercase mb-2">保留中の申請</h3>
        <div id="pending-friends-list" class="space-y-2"></div>
      </div>
      <div>
        <h3 class="text-xs font-bold text-[#949ba4] uppercase mb-2">フレンド一覧（オンライン状況）</h3>
        <div id="accepted-friends-list" class="space-y-2"></div>
      </div>
    </div>

    <!-- チャット画面 -->
    <div id="chat-view" class="hidden flex-1 flex flex-col min-h-0">
      <div id="chat-messages" class="flex-1 scroll-area p-4 space-y-3"></div>
      <div class="p-3 bg-[#313338] shrink-0">
        <form onsubmit="sendMessage(event)" class="flex gap-2 bg-[#383a40] rounded-lg px-3 py-2">
          <input id="chat-input" type="text" placeholder="メッセージを送信..." autocomplete="off" class="flex-1 bg-transparent text-white text-sm outline-none">
          <button type="submit" class="px-3 py-1 rounded bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold shrink-0">送信</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- サーバー作成/参加モーダル -->
<div id="server-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="bg-[#313338] w-full max-w-sm rounded-xl p-5 space-y-4">
    <h3 class="text-lg font-bold text-white text-center">サーバーを作成・参加</h3>
    <div>
      <label class="block text-xs font-bold text-[#b5bac1] mb-1">新規サーバー作成</label>
      <div class="flex gap-2">
        <input id="new-server-name" type="text" placeholder="サーバー名" class="flex-1 px-3 py-2 rounded bg-[#1e1f22] text-white text-sm outline-none">
        <button onclick="createServer()" class="px-3 py-2 rounded bg-[#5865f2] text-white text-xs font-bold">作成</button>
      </div>
    </div>
    <div class="border-t border-[#3f4147] pt-3">
      <label class="block text-xs font-bold text-[#b5bac1] mb-1">招待コードで参加</label>
      <div class="flex gap-2">
        <input id="join-invite-code" type="text" placeholder="招待コード入力" class="flex-1 px-3 py-2 rounded bg-[#1e1f22] text-white text-sm outline-none">
        <button onclick="joinServer()" class="px-3 py-2 rounded bg-[#23a55a] text-white text-xs font-bold">参加</button>
      </div>
    </div>
    <button onclick="closeModal('server-modal')" class="w-full py-2 rounded bg-[#4e5058] text-white text-xs">閉じる</button>
  </div>
</div>

<!-- プロフィール編集モーダル -->
<div id="profile-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="bg-[#313338] w-full max-w-sm rounded-xl p-5 space-y-4">
    <h3 class="text-lg font-bold text-white">プロフィール編集</h3>
    <div class="flex flex-col items-center gap-2">
      <div id="edit-avatar-preview" class="w-16 h-16 rounded-full bg-[#5865f2] flex items-center justify-center text-white font-bold text-xl overflow-hidden"></div>
      <label class="px-3 py-1.5 rounded bg-[#4e5058] hover:bg-[#6d6f78] text-white text-xs cursor-pointer">
        画像を選択 <input type="file" accept="image/*" onchange="handleAvatarUpload(event)" class="hidden">
      </label>
    </div>
    <div>
      <label class="block text-xs font-bold text-[#b5bac1] mb-1">表示名</label>
      <input id="edit-username" type="text" class="w-full px-3 py-2 rounded bg-[#1e1f22] text-white text-sm outline-none">
    </div>
    <div>
      <label class="block text-xs font-bold text-[#b5bac1] mb-1">アイコン背景色</label>
      <input id="edit-avatar-color" type="color" class="w-full h-9 rounded bg-[#1e1f22] cursor-pointer">
    </div>
    <div class="flex gap-2">
      <button onclick="closeModal('profile-modal')" class="flex-1 py-2 rounded bg-[#4e5058] text-white text-xs">キャンセル</button>
      <button onclick="saveProfile()" class="flex-1 py-2 rounded bg-[#5865f2] text-white text-xs font-bold">保存</button>
    </div>
  </div>
</div>

<!-- サーバー設定（ロール・権限）モーダル -->
<div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="bg-[#313338] w-full max-w-md rounded-xl p-5 max-h-[85dvh] flex flex-col">
    <div class="flex items-center justify-between pb-3 border-b border-[#3f4147]">
      <h3 class="text-base font-bold text-white">サーバー設定（ロール・権限）</h3>
      <button onclick="closeModal('settings-modal')" class="text-[#b5bac1] hover:text-white">✕</button>
    </div>
    <div class="flex-1 scroll-area py-3 space-y-4">
      <div class="bg-[#2b2d31] p-3 rounded-lg space-y-2">
        <div class="text-xs font-bold text-white">新しいロールを作成</div>
        <div class="flex gap-2">
          <input id="role-name-input" type="text" placeholder="ロール名 (例: 管理者)" class="flex-1 px-2.5 py-1.5 rounded bg-[#1e1f22] text-white text-xs outline-none">
          <input id="role-color-input" type="color" value="#e91e63" class="w-9 h-8 rounded bg-[#1e1f22]">
        </div>
        <div class="grid grid-cols-2 gap-1.5 text-xs text-[#dbdee1] pt-1">
          <label class="flex items-center gap-1.5"><input type="checkbox" id="perm-send" checked> メッセージ送信</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" id="perm-del"> メッセージ削除</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" id="perm-role"> ロール管理</label>
          <label class="flex items-center gap-1.5"><input type="checkbox" id="perm-kick"> メンバー追放</label>
        </div>
        <button onclick="createRole()" class="w-full py-1.5 rounded bg-[#5865f2] text-white text-xs font-bold mt-1">ロール追加</button>
      </div>
      <div>
        <div class="text-xs font-bold text-[#949ba4] mb-1.5">作成済みロール</div>
        <div id="roles-list" class="space-y-1.5"></div>
      </div>
      <div>
        <div class="text-xs font-bold text-[#949ba4] mb-1.5">メンバーへのロール付与</div>
        <div id="members-role-list" class="space-y-2"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://huzzkisjvjdyljkvmeze.supabase.co";
const SUPABASE_KEY = "sb_publishable_RoYU3XG8ohLuRW7baisURA_VDsCtD3l";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, myProfile = null, isSignUp = false;
let currentRoom = { type: 'home', id: null, name: 'フレンド', ownerId: null };
let onlineUsers = new Set(), profilesMap = {}, serverRoles = [], memberRoles = [];
let uploadedAvatarBase64 = null;

// WebRTC 通話・画面共有用変数
let callChannel = null, localStream = null, screenStream = null, peers = {}, inCall = false;

window.onload = async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) initApp(session.user);
};

function toggleAuthMode() {
  isSignUp = !isSignUp;
  document.getElementById('auth-title').textContent = isSignUp ? 'Raphael アカウント作成' : 'Raphael にログイン';
  document.getElementById('auth-submit-btn').textContent = isSignUp ? '登録する' : 'ログイン';
  document.getElementById('auth-toggle-btn').textContent = isSignUp ? 'すでにアカウントをお持ちの方はこちら' : 'アカウント登録はこちら';
  document.getElementById('username-field').classList.toggle('hidden', !isSignUp);
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const username = document.getElementById('auth-username').value.trim() || email.split('@')[0];
  const errEl = document.getElementById('auth-error');
  errEl.classList.add('hidden');
  try {
    if (isSignUp) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
      if (error) throw error;
      if (data.user) {
        const code = String(Math.floor(1000 + Math.random() * 9000));
        await sb.from('profiles').upsert({ id: data.user.id, username, friend_code: code });
        initApp(data.user);
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      initApp(data.user);
    }
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
}

async function logout() {
  leaveCall();
  await sb.auth.signOut();
  location.reload();
}

async function initApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  await loadMyProfile();
  setupPresence();
  setupRealtime();
  await loadServers();
  selectHome();
}

async function loadMyProfile() {
  let { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (!data) {
    const code = String(Math.floor(1000 + Math.random() * 9000));
    const uname = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    const res = await sb.from('profiles').insert({ id: currentUser.id, username: uname, friend_code: code }).select().single();
    data = res.data;
  }
  myProfile = data;
  profilesMap[myProfile.id] = myProfile;
  renderAvatar(document.getElementById('my-avatar'), myProfile);
  document.getElementById('my-username').textContent = myProfile.username;
  document.getElementById('my-code').textContent = '#' + myProfile.friend_code;
  document.getElementById('my-full-id').textContent = `${myProfile.username}#${myProfile.friend_code}`;
}

function renderAvatar(el, profile) {
  if (!profile) return;
  if (profile.avatar_url) {
    el.innerHTML = `<img src="${profile.avatar_url}" class="w-full h-full object-cover">`;
  } else {
    el.style.backgroundColor = profile.avatar_color || '#5865f2';
    el.textContent = (profile.username || '?')[0].toUpperCase();
  }
}

function setupPresence() {
  const room = sb.channel('online-users');
  room.on('presence', { event: 'sync' }, () => {
    onlineUsers = new Set(Object.keys(room.presenceState()));
    if (currentRoom.type === 'home') loadFriends();
  }).subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await room.track({ user_id: currentUser.id });
  });
}

function setupRealtime() {
  sb.channel('db-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new;
      if ((currentRoom.type === 'server' && m.server_id === currentRoom.id) ||
          (currentRoom.type === 'dm' && m.dm_id === currentRoom.id)) {
        appendMessage(m);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => {
      if (currentRoom.type === 'home') loadFriends();
    })
    .subscribe();
}

function toggleDrawer(open) {
  const drawer = document.getElementById('left-drawer');
  const overlay = document.getElementById('drawer-overlay');
  drawer.classList.toggle('-translate-x-full', !open);
  overlay.classList.toggle('hidden', !open);
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// プロフィール編集
function openProfileModal() {
  uploadedAvatarBase64 = myProfile.avatar_url || null;
  document.getElementById('edit-username').value = myProfile.username;
  document.getElementById('edit-avatar-color').value = myProfile.avatar_color || '#5865f2';
  renderAvatar(document.getElementById('edit-avatar-preview'), myProfile);
  openModal('profile-modal');
}

function handleAvatarUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      canvas.getContext('2d').drawImage(img, 0, 0, 128, 128);
      uploadedAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
      document.getElementById('edit-avatar-preview').innerHTML = `<img src="${uploadedAvatarBase64}" class="w-full h-full object-cover">`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProfile() {
  const username = document.getElementById('edit-username').value.trim() || myProfile.username;
  const avatar_color = document.getElementById('edit-avatar-color').value;
  await sb.from('profiles').update({ username, avatar_color, avatar_url: uploadedAvatarBase64 }).eq('id', currentUser.id);
  await loadMyProfile();
  closeModal('profile-modal');
}

// サーバー機能
async function loadServers() {
  const { data } = await sb.from('server_members').select('server_id, servers(*)').eq('user_id', currentUser.id);
  const list = document.getElementById('server-list');
  list.innerHTML = '';
  (data || []).forEach(row => {
    const s = row.servers;
    if (!s) return;
    const btn = document.createElement('button');
    btn.className = 'w-12 h-12 rounded-3xl hover:rounded-xl bg-[#313338] hover:bg-[#5865f2] text-white font-bold text-sm flex items-center justify-center transition shrink-0';
    btn.textContent = s.name.slice(0, 2);
    btn.onclick = () => selectServer(s);
    list.appendChild(btn);
  });
}

async function createServer() {
  const name = document.getElementById('new-server-name').value.trim();
  if (!name) return;
  const invite_code = Math.random().toString(36).substring(2, 8).toUpperCase();
  const { data: s, error } = await sb.from('servers').insert({ name, invite_code, owner_id: currentUser.id }).select().single();
  if (error) return alert(error.message);
  await sb.from('server_members').insert({ server_id: s.id, user_id: currentUser.id });
  document.getElementById('new-server-name').value = '';
  closeModal('server-modal');
  await loadServers();
  selectServer(s);
}

async function joinServer() {
  const code = document.getElementById('join-invite-code').value.trim().toUpperCase();
  if (!code) return;
  const { data: s } = await sb.from('servers').select('*').eq('invite_code', code).single();
  if (!s) return alert('招待コードが見つかりません');
  await sb.from('server_members').upsert({ server_id: s.id, user_id: currentUser.id });
  document.getElementById('join-invite-code').value = '';
  closeModal('server-modal');
  await loadServers();
  selectServer(s);
}

function selectHome() {
  leaveCall();
  currentRoom = { type: 'home', id: null, name: 'フレンド', ownerId: null };
  document.getElementById('sidebar-title').textContent = 'ダイレクトメッセージ';
  document.getElementById('main-header-icon').textContent = '👥';
  document.getElementById('main-header-title').textContent = 'フレンド';
  document.getElementById('server-settings-btn').classList.add('hidden');
  document.getElementById('invite-btn').classList.add('hidden');
  document.getElementById('call-toggle-btn').classList.add('hidden');
  document.getElementById('call-panel').classList.add('hidden');
  document.getElementById('friends-view').classList.remove('hidden');
  document.getElementById('chat-view').classList.add('hidden');
  toggleDrawer(false);
  loadFriends();
}

async function selectServer(s) {
  leaveCall();
  currentRoom = { type: 'server', id: s.id, name: s.name, invite: s.invite_code, ownerId: s.owner_id };
  document.getElementById('sidebar-title').textContent = s.name;

  document.getElementById('invite-btn').classList.remove('hidden');
  document.getElementById('call-toggle-btn').classList.remove('hidden');
  document.getElementById('friends-view').classList.add('hidden');

    <div class="px-2 py-1.5 rounded bg-[#35373c] text-white text-sm font-medium flex items-center gap-2"><span class="text-[#80848e]">#</span> 一般チャット</div>
    <div onclick="toggleCallArea()" class="px-2 py-1.5 rounded hover:bg-[#35373c] text-[#949ba4] hover:text-white text-sm cursor-pointer flex items-center gap-2"><span>🔊</span> ボイス・画面共有</div>
  `;

function showInviteCode() {
  alert(`サーバー「${currentRoom.name}」の招待コード:

${currentRoom.invite}

友達にこのコードを教えて参加してもらおう！`);
}

// フレンド・DM
async function loadFriends() {
  const { data: allProfiles } = await sb.from('profiles').select('*');
  (allProfiles || []).forEach(p => profilesMap[p.id] = p);

  const { data: rels } = await sb.from('friendships').select('*').or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`);
  const pendingEl = document.getElementById('pending-friends-list');
  const acceptedEl = document.getElementById('accepted-friends-list');
  const dmSidebar = document.getElementById('sidebar-content');
  pendingEl.innerHTML = ''; acceptedEl.innerHTML = ''; dmSidebar.innerHTML = '';

  (rels || []).forEach(r => {
    const otherId = r.requester_id === currentUser.id ? r.addressee_id : r.requester_id;
    const p = profilesMap[otherId];
    if (!p) return;
    if (r.status === 'pending') {
      const isIncoming = r.addressee_id === currentUser.id;
      pendingEl.innerHTML += `
        <div class="flex items-center justify-between bg-[#2b2d31] p-2.5 rounded">
          <span class="text-sm text-white">${p.username}#${p.friend_code}</span>
          ${isIncoming ? `<button onclick="acceptFriend('${r.id}')" class="px-2.5 py-1 rounded bg-[#23a55a] text-white text-xs font-bold">承認</button>` : `<span class="text-xs text-[#949ba4]">申請中</span>`}
        </div>`;
    } else if (r.status === 'accepted') {
      const isOnline = onlineUsers.has(p.id);
      const dmId = [currentUser.id, p.id].sort().join('_');
      acceptedEl.innerHTML += `
        <div onclick="openDM('${dmId}', '${p.username}')" class="flex items-center justify-between bg-[#2b2d31] hover:bg-[#35373c] p-2.5 rounded cursor-pointer">
          <div class="flex items-center gap-2.5">
            <div class="relative w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center text-white text-xs font-bold overflow-hidden">
              ${p.avatar_url ? `<img src="${p.avatar_url}" class="w-full h-full object-cover">` : p.username[0]}
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'} ring-2 ring-[#2b2d31]"></span>
            </div>
            <div>
              <div class="text-sm font-bold text-white">${p.username}</div>
              <div class="text-[11px] text-[#949ba4]">${isOnline ? 'オンライン' : 'オフライン'}</div>
            </div>
          </div>
          <span class="text-xs bg-[#1e1f22] px-2.5 py-1 rounded text-[#dbdee1]">DM</span>
        </div>`;
      dmSidebar.innerHTML += `
        <div onclick="openDM('${dmId}', '${p.username}')" class="px-2 py-1.5 rounded hover:bg-[#35373c] text-[#dbdee1] text-sm cursor-pointer flex items-center gap-2">
          <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'}"></span> ${p.username}
        </div>`;
    }
  });
}

async function sendFriendRequest() {
  const val = document.getElementById('friend-add-input').value.trim();
  const [uname, code] = val.split('#');
  if (!uname || !code) return alert('「ユーザー名#4桁コード」の形式で入力してください');
  const { data: target } = await sb.from('profiles').select('*').eq('username', uname).eq('friend_code', code).single();
  if (!target) return alert('ユーザーが見つかりません');
  if (target.id === currentUser.id) return alert('自分自身には申請できません');
  await sb.from('friendships').insert({ requester_id: currentUser.id, addressee_id: target.id });
  document.getElementById('friend-add-input').value = '';
  alert('フレンド申請を送りました！');
  loadFriends();
}

async function acceptFriend(id) {
  await sb.from('friendships').update({ status: 'accepted' }).eq('id', id);
  loadFriends();
}

function openDM(dmId, name) {
  currentRoom = { type: 'dm', id: dmId, name };
  document.getElementById('main-header-icon').textContent = '@';
  document.getElementById('main-header-title').textContent = name;
  document.getElementById('friends-view').classList.add('hidden');
  document.getElementById('chat-view').classList.remove('hidden');
  toggleDrawer(false);
  loadMessages();
}

// メッセージ送信・表示
async function loadMessages() {
  const box = document.getElementById('chat-messages');
  box.innerHTML = '';
  let q = sb.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
  q = currentRoom.type === 'server' ? q.eq('server_id', currentRoom.id) : q.eq('dm_id', currentRoom.id);
  const { data } = await q;
  (data || []).forEach(appendMessage);
}

function appendMessage(m) {
  const box = document.getElementById('chat-messages');
  const p = profilesMap[m.sender_id] || { username: 'ユーザー', avatar_color: '#5865f2' };
  const userRoleIds = memberRoles.filter(mr => mr.user_id === m.sender_id).map(mr => mr.role_id);
  const topRole = serverRoles.find(r => userRoleIds.includes(r.id));
  const nameColor = topRole ? topRole.color : '#ffffff';
  const roleBadge = topRole ? `<span class="text-[10px] px-1.5 py-0.5 rounded ml-1.5" style="background:${topRole.color}33; color:${topRole.color}">${topRole.name}</span>` : '';

  const div = document.createElement('div');
  div.className = 'flex items-start gap-3';
  div.innerHTML = `
    <div class="w-9 h-9 rounded-full shrink-0 flex items-center justify-center text-white font-bold text-xs overflow-hidden" style="background:${p.avatar_color || '#5865f2'}">
      ${p.avatar_url ? `<img src="${p.avatar_url}" class="w-full h-full object-cover">` : p.username[0]}
    </div>
    <div class="min-w-0 flex-1">
      <div class="flex items-baseline flex-wrap">
        <span class="font-bold text-sm" style="color:${nameColor}">${p.username}</span>${roleBadge}
        <span class="text-[10px] text-[#949ba4] ml-2">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
      </div>
      <div class="text-sm text-[#dbdee1] break-words whitespace-pre-wrap mt-0.5">${escapeHtml(m.content)}</div>
    </div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(e) {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  const payload = { sender_id: currentUser.id, content };
  if (currentRoom.type === 'server') payload.server_id = currentRoom.id;
  else payload.dm_id = currentRoom.id;
  const { error } = await sb.from('messages').insert(payload);
  if (error) alert('送信エラー: ' + error.message);
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ロール・権限管理
async function loadRolesData(serverId) {
  const [rRes, mrRes, memRes] = await Promise.all([
    sb.from('server_roles').select('*').eq('server_id', serverId),
    sb.from('member_roles').select('*').eq('server_id', serverId),
    sb.from('server_members').select('user_id, profiles(*)').eq('server_id', serverId)
  ]);
  serverRoles = rRes.data || [];
  memberRoles = mrRes.data || [];
  (memRes.data || []).forEach(m => { if (m.profiles) profilesMap[m.user_id] = m.profiles; });
}

async function openServerSettings() {
  await loadRolesData(currentRoom.id);
  const rolesEl = document.getElementById('roles-list');
  rolesEl.innerHTML = serverRoles.map(r => `
    <div class="flex items-center justify-between bg-[#2b2d31] px-3 py-1.5 rounded text-xs">
      <span class="font-bold" style="color:${r.color}">● ${r.name}</span>
      <button onclick="deleteRole('${r.id}')" class="text-red-400 hover:underline">削除</button>
    </div>`).join('') || '<div class="text-xs text-[#949ba4]">ロールはまだありません</div>';

  const { data: mems } = await sb.from('server_members').select('user_id, profiles(*)').eq('server_id', currentRoom.id);
  const memEl = document.getElementById('members-role-list');
  memEl.innerHTML = (mems || []).map(m => {
    const p = m.profiles;
    if (!p) return '';
    const assigned = memberRoles.filter(mr => mr.user_id === p.id).map(mr => mr.role_id);
    const roleBtns = serverRoles.map(r => {
      const has = assigned.includes(r.id);
      return `<button onclick="toggleMemberRole('${p.id}', '${r.id}', ${has})" class="px-2 py-0.5 rounded text-[10px] border ${has ? 'font-bold' : 'opacity-40'}" style="border-color:${r.color}; color:${r.color}">${has ? '✓ ' : '+ '}${r.name}</button>`;
    }).join(' ');
    return `<div class="bg-[#2b2d31] p-2.5 rounded"><div class="text-xs font-bold text-white mb-1.5">${p.username}</div><div class="flex flex-wrap gap-1">${roleBtns || '<span class="text-[10px] text-[#949ba4]">先にロールを作成してください</span>'}</div></div>`;
  }).join('');
  openModal('settings-modal');
}

async function createRole() {
  const name = document.getElementById('role-name-input').value.trim();
  if (!name) return;
  const color = document.getElementById('role-color-input').value;
  const { error } = await sb.from('server_roles').insert({
    server_id: currentRoom.id, name, color,
    can_send_messages: document.getElementById('perm-send').checked,
    can_delete_messages: document.getElementById('perm-del').checked,
    can_manage_roles: document.getElementById('perm-role').checked,
    can_kick_members: document.getElementById('perm-kick').checked
  });
  if (error) return alert('ロールテーブル未作成のためSQLを実行してください: ' + error.message);
  document.getElementById('role-name-input').value = '';
  openServerSettings();
}

async function deleteRole(roleId) {
  await sb.from('server_roles').delete().eq('id', roleId);
  openServerSettings();
}

async function toggleMemberRole(userId, roleId, hasRole) {
  if (hasRole) {
    await sb.from('member_roles').delete().match({ server_id: currentRoom.id, user_id: userId, role_id: roleId });
  } else {
    await sb.from('member_roles').insert({ server_id: currentRoom.id, user_id: userId, role_id: roleId });
  }
  openServerSettings();
}

// WebRTC 通話＆画面共有
function toggleCallArea() {
  document.getElementById('call-panel').classList.toggle('hidden');
}

async function joinCall() {
  if (inCall) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    alert('マイク許可が取得できませんでした（視聴のみで参加します）');
    localStream = new MediaStream();
  }
  inCall = true;
  document.getElementById('join-call-btn').classList.add('hidden');
  document.getElementById('mic-btn').classList.remove('hidden');
  document.getElementById('screen-btn').classList.remove('hidden');
  document.getElementById('leave-call-btn').classList.remove('hidden');

  callChannel = sb.channel('call-' + currentRoom.id);
  callChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
    if (payload.to !== currentUser.id) return;
    const pc = getOrCreatePeer(payload.from);
    if (payload.sdp) {
      await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      if (payload.sdp.type === 'offer') {
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        callChannel.send({ type: 'broadcast', event: 'signal', payload: { from: currentUser.id, to: payload.from, sdp: pc.localDescription } });
      }
    } else if (payload.candidate) {
      await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
    }
  }).on('broadcast', { event: 'join' }, async ({ payload }) => {
    if (payload.userId === currentUser.id) return;
    const pc = getOrCreatePeer(payload.userId);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    callChannel.send({ type: 'broadcast', event: 'signal', payload: { from: currentUser.id, to: payload.userId, sdp: pc.localDescription } });
  }).subscribe(status => {
    if (status === 'SUBSCRIBED') {
      callChannel.send({ type: 'broadcast', event: 'join', payload: { userId: currentUser.id } });
    }
  });
}

function getOrCreatePeer(peerId) {
  if (peers[peerId]) return peers[peerId];
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  peers[peerId] = pc;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  if (screenStream) screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));

  pc.onicecandidate = e => {
    if (e.candidate && callChannel) {
      callChannel.send({ type: 'broadcast', event: 'signal', payload: { from: currentUser.id, to: peerId, candidate: e.candidate } });
    }
  };
  pc.ontrack = e => {
    const stream = e.streams[0];
    if (e.track.kind === 'video') {
      let vid = document.getElementById('vid-' + peerId);
      if (!vid) {
        vid = document.createElement('video');
        vid.id = 'vid-' + peerId;
        vid.autoplay = true; vid.playsInline = true;
        vid.className = 'w-full rounded bg-black aspect-video object-contain cursor-pointer';
        vid.onclick = () => vid.requestFullscreen?.();
        document.getElementById('video-grid').appendChild(vid);
      }
      vid.srcObject = stream;
    } else {
      let aud = document.getElementById('aud-' + peerId);
      if (!aud) {
        aud = document.createElement('audio');
        aud.id = 'aud-' + peerId; aud.autoplay = true;
        document.getElementById('remote-audios').appendChild(aud);
      }
      aud.srcObject = stream;
    }
  };
  return pc;
}

function toggleMic() {
  const track = localStream?.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  document.getElementById('mic-btn').textContent = track.enabled ? '🎤 ミュート' : '🔇 ミュート解除';
}

async function toggleScreenShare() {
  if (screenStream) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    document.getElementById('local-screen')?.remove();
    document.getElementById('screen-btn').textContent = '🖥️ 画面共有';
    return;
  }
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const vid = document.createElement('video');
    vid.id = 'local-screen'; vid.autoplay = true; vid.muted = true; vid.playsInline = true;
    vid.className = 'w-full rounded bg-black aspect-video object-contain border border-[#5865f2]';
    vid.srcObject = screenStream;
    document.getElementById('video-grid').appendChild(vid);
    document.getElementById('screen-btn').textContent = '⏹️ 共有停止';

    for (const [peerId, pc] of Object.entries(peers)) {
      screenStream.getTracks().forEach(t => pc.addTrack(t, screenStream));
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      callChannel.send({ type: 'broadcast', event: 'signal', payload: { from: currentUser.id, to: peerId, sdp: pc.localDescription } });
    }
    screenStream.getVideoTracks()[0].onended = () => toggleScreenShare();
  } catch (e) {
    alert('この端末またはブラウザでは画面共有がサポートされていません');
  }
}

function leaveCall() {
  inCall = false;
  localStream?.getTracks().forEach(t => t.stop());
  screenStream?.getTracks().forEach(t => t.stop());
  localStream = null; screenStream = null;
  Object.values(peers).forEach(pc => pc.close());
  peers = {};
  if (callChannel) { sb.removeChannel(callChannel); callChannel = null; }
  document.getElementById('video-grid').innerHTML = '';
  document.getElementById('remote-audios').innerHTML = '';
  document.getElementById('join-call-btn').classList.remove('hidden');
  document.getElementById('mic-btn').classList.add('hidden');
  document.getElementById('screen-btn').classList.add('hidden');
  document.getElementById('leave-call-btn').classList.add('hidden');
}
</script>
