<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Raphael</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #1e1f22;
      color: #dbdee1;
      font-family: 'gg sans', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 9999px; }
  </style>
</head>
<body>
  <div id="app" class="h-full w-full flex flex-col"></div>

  <script>
    // ==========================================
    // 状態管理
    // ==========================================
    let supabase = null;
    let currentUser = null;
    let currentProfile = null;
    let servers = [];
    let currentView = { type: 'friends', id: null, name: 'フレンド' }; // type: 'friends' | 'server' | 'dm'
    let messages = [];
    let friends = [];
    let pendingRequests = [];
    let onlineUserIds = new Set();
    let serverMembers = [];
    let mobileDrawerOpen = false; // スマホ用サイドバー開閉状態
    let activeTab = 'online'; // 'online' | 'all' | 'pending' | 'add'

    let messageSub = null;
    let presenceChannel = null;

    // ==========================================
    // 初期化処理
    // ==========================================
    async function init() {
      const savedUrl = localStorage.getItem('raphael_supabase_url');
      const savedKey = localStorage.getItem('raphael_supabase_key');

      if (!savedUrl || !savedKey) {
        renderSetupScreen();
        return;
      }

      try {
        supabase = window.supabase.createClient(savedUrl, savedKey);
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) throw error;

        if (!session) {
          renderAuthScreen();
        } else {
          currentUser = session.user;
          await loadInitialData();
        }
      } catch (e) {
        console.error(e);
        renderSetupScreen('接続に失敗しました。URLとキーを確認してください。');
      }
    }

    // ==========================================
    // 1. 初期セットアップ画面（URL & Key）
    // ==========================================
    function renderSetupScreen(errorMsg = '') {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="h-full w-full flex items-center justify-center p-4 bg-[#1e1f22] overflow-y-auto">
          <div class="w-full max-w-md bg-[#313338] rounded-xl p-6 shadow-2xl border border-[#3f4147]">
            <div class="flex items-center gap-3 mb-4">
              <div class="w-10 h-10 rounded-xl bg-[#5865f2] flex items-center justify-center font-bold text-white text-xl">R</div>
              <div>
                <h1 class="text-xl font-bold text-white">Raphael 初期セットアップ</h1>
                <p class="text-xs text-[#949ba4]">Supabaseの接続情報を入力してください</p>
              </div>
            </div>
            ${errorMsg ? `<div class="mb-4 p-3 rounded bg-red-500/20 border border-red-500 text-red-200 text-xs">${errorMsg}</div>` : ''}
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1.5">Project URL</label>
                <input id="setup-url" type="text" placeholder="https://xxxx.supabase.co"
                  class="w-full bg-[#1e1f22] text-white text-sm rounded-lg px-3 py-2.5 border border-[#1e1f22] focus:border-[#5865f2] outline-none" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1.5">Anon Public Key</label>
                <input id="setup-key" type="text" placeholder="sb_publishable_... または eyJhb..."
                  class="w-full bg-[#1e1f22] text-white text-sm rounded-lg px-3 py-2.5 border border-[#1e1f22] focus:border-[#5865f2] outline-none" />
              </div>
              <button onclick="saveSetup()"
                class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-semibold py-2.5 rounded-lg transition text-sm">
                保存して次へ
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function saveSetup() {
      const url = document.getElementById('setup-url').value.trim();
      const key = document.getElementById('setup-key').value.trim();
      if (!url || !key) {
        alert('URLとキーの両方を入力してください');
        return;
      }
      localStorage.setItem('raphael_supabase_url', url);
      localStorage.setItem('raphael_supabase_key', key);
      init();
    }

    // ==========================================
    // 2. ログイン・新規登録画面
    // ==========================================
    function renderAuthScreen(isRegister = false) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="h-full w-full flex items-center justify-center p-4 bg-[#1e1f22] overflow-y-auto">
          <div class="w-full max-w-md bg-[#313338] rounded-xl p-6 shadow-2xl border border-[#3f4147]">
            <div class="text-center mb-6">
              <div class="w-12 h-12 rounded-2xl bg-[#5865f2] flex items-center justify-center font-bold text-white text-2xl mx-auto mb-3 shadow-lg">R</div>
              <h1 class="text-2xl font-bold text-white">${isRegister ? 'Raphael アカウント作成' : 'おかえりなさい！'}</h1>
              <p class="text-xs text-[#949ba4] mt-1">${isRegister ? '新しいプロフィールを作成します' : 'ログインしてチャットを始めましょう'}</p>
            </div>
            <div class="space-y-4">
              ${isRegister ? `
                <div>
                  <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1.5">ユーザー名</label>
                  <input id="auth-username" type="text" placeholder="表示される名前"
                    class="w-full bg-[#1e1f22] text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-[#5865f2]" />
                </div>
              ` : ''}
              <div>
                <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1.5">メールアドレス</label>
                <input id="auth-email" type="email" placeholder="example@email.com"
                  class="w-full bg-[#1e1f22] text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-[#5865f2]" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1.5">パスワード</label>
                <input id="auth-password" type="password" placeholder="6文字以上"
                  class="w-full bg-[#1e1f22] text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-[#5865f2]" />
              </div>
              <button onclick="${isRegister ? 'handleRegister()' : 'handleLogin()'}"
                class="w-full bg-[#5865f2] hover:bg-[#4752c4] text-white font-semibold py-2.5 rounded-lg transition text-sm">
                ${isRegister ? '登録して始める' : 'ログイン'}
              </button>
              <div class="text-center pt-2">
                <button onclick="renderAuthScreen(${!isRegister})" class="text-xs text-[#00a8fc] hover:underline">
                  ${isRegister ? 'すでにアカウントをお持ちの方はこちら' : 'アカウント登録はこちら'}
                </button>
              </div>
              <div class="text-center border-t border-[#3f4147] pt-3">
                <button onclick="resetConfig()" class="text-[11px] text-[#949ba4] hover:text-white">
                  Supabase接続設定をリセット
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function resetConfig() {
      if (confirm('接続設定をリセットしますか？')) {
        localStorage.removeItem('raphael_supabase_url');
        localStorage.removeItem('raphael_supabase_key');
        renderSetupScreen();
      }
    }

    async function handleLogin() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return alert('メールアドレスとパスワードを入力してください');

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('ログインエラー: ' + error.message);
        return;
      }
      currentUser = data.user;
      await loadInitialData();
    }

    async function handleRegister() {
      const username = document.getElementById('auth-username').value.trim();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!username || !email || !password) return alert('すべての項目を入力してください');

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });
      if (error) {
        alert('登録エラー: ' + error.message);
        return;
      }
      if (!data.session) {
        alert('確認メールが送信されました。Supabaseの「Confirm email」をオフにするかメールを確認してください。');
        return;
      }

      currentUser = data.user;
      const friendCode = String(Math.floor(1000 + Math.random() * 9000));
      await supabase.from('profiles').upsert({
        id: currentUser.id,
        username: username,
        friend_code: friendCode,
        avatar_color: '#5865f2'
      });

      await loadInitialData();
    }

    async function handleLogout() {
      if (presenceChannel) await supabase.removeChannel(presenceChannel);
      if (messageSub) await supabase.removeChannel(messageSub);
      await supabase.auth.signOut();
      currentUser = null;
      currentProfile = null;
      renderAuthScreen();
    }

    // ==========================================
    // 3. データ読み込み＆リアルタイム監視
    // ==========================================
    async function loadInitialData() {
      // プロフィール取得（なければ自動作成）
      let { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (!profile) {
        const fallbackName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        const friendCode = String(Math.floor(1000 + Math.random() * 9000));
        const { data: newProf } = await supabase
          .from('profiles')
          .insert({ id: currentUser.id, username: fallbackName, friend_code: friendCode })
          .select()
          .single();
        profile = newProf;
      }
      currentProfile = profile;

      await Promise.all([
        fetchServers(),
        fetchFriends()
      ]);

      setupPresence();
      setupRealtimeMessages();
      renderMainApp();
    }

    async function fetchServers() {
      const { data: memberships } = await supabase
        .from('server_members')
        .select('server_id, servers(*)')
        .eq('user_id', currentUser.id);

      servers = (memberships || [])
        .map(m => m.servers)
        .filter(Boolean);
    }

    async function fetchFriends() {
      const { data: rows } = await supabase
        .from('friendships')
        .select(`
          *,
          requester:profiles!friendships_requester_id_fkey(*),
          addressee:profiles!friendships_addressee_id_fkey(*)
        `)
        .or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`);

      friends = [];
      pendingRequests = [];

      (rows || []).forEach(r => {
        const other = r.requester_id === currentUser.id ? r.addressee : r.requester;
        if (!other) return;
        if (r.status === 'accepted') {
          friends.push({ ...other, friendship_id: r.id });
        } else if (r.status === 'pending' && r.addressee_id === currentUser.id) {
          pendingRequests.push({ ...other, friendship_id: r.id });
        }
      });
    }

    function setupPresence() {
      if (presenceChannel) supabase.removeChannel(presenceChannel);
      presenceChannel = supabase.channel('online-users', {
        config: { presence: { key: currentUser.id } }
      });

      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          onlineUserIds = new Set(Object.keys(state));
          renderMainApp();
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({ online_at: new Date().toISOString() });
          }
        });
    }

    function setupRealtimeMessages() {
      if (messageSub) supabase.removeChannel(messageSub);
      messageSub = supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async (payload) => {
          const newMsg = payload.new;
          const isCurrentRoom =
            (currentView.type === 'server' && newMsg.server_id === currentView.id) ||
            (currentView.type === 'dm' && newMsg.dm_id === currentView.id);

          if (isCurrentRoom) {
            const { data: sender } = await supabase
              .from('profiles')
              .select('*')
              .eq('id', newMsg.sender_id)
              .single();
            messages.push({ ...newMsg, sender });
            renderMainApp();
            scrollToBottom();
          }
        })
        .subscribe();
    }

    // ==========================================
    // 4. メイン画面レンダリング（スマホ完全レスポンシブ）
    // ==========================================
    function renderAvatar(profile, sizeClass = 'w-10 h-10', textClass = 'text-sm', showStatus = false) {
      if (!profile) return '';
      const isOnline = onlineUserIds.has(profile.id) || profile.id === currentUser?.id;
      const initial = (profile.username || '?').charAt(0).toUpperCase();
      const bgColor = profile.avatar_color || '#5865f2';

      return `
        <div class="relative inline-block shrink-0 ${sizeClass}">
          ${profile.avatar_url
            ? `<img src="${profile.avatar_url}" class="${sizeClass} rounded-full object-cover bg-[#1e1f22]" />`
            : `<div class="${sizeClass} rounded-full flex items-center justify-center font-bold text-white ${textClass}" style="background-color: ${bgColor};">${escapeHtml(initial)}</div>`
          }
          ${showStatus ? `
            <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-[#232428] ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'}"></span>
          ` : ''}
        </div>
      `;
    }

    function renderMainApp() {
      const app = document.getElementById('app');

      // スマホでドロワーが開いている時の背景オーバーレイ＋左メニュー
      const sidebarHTML = `
        <div class="flex h-full shrink-0">
          <!-- 一番左：サーバー一覧レール -->
          <div class="w-[68px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2.5 overflow-y-auto shrink-0 border-r border-[#18191c]">
            <!-- ホーム（フレンド・DM）ボタン -->
            <button onclick="switchToFriends()"
              class="w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all flex items-center justify-center font-bold text-lg shadow
              ${currentView.type !== 'server' ? 'bg-[#5865f2] text-white rounded-[16px]' : 'bg-[#313338] text-[#dbdee1] hover:bg-[#5865f2] hover:text-white'}"
              title="フレンド・DM">
              R
            </button>

            <div class="w-8 h-[2px] bg-[#35363c] rounded-full"></div>

            <!-- 参加中のサーバー一覧 -->
            ${servers.map(srv => {
              const isActive = currentView.type === 'server' && currentView.id === srv.id;
              return `
                <button onclick="switchToServer('${srv.id}', '${escapeJs(srv.name)}', '${srv.invite_code}')"
                  class="w-12 h-12 rounded-[24px] hover:rounded-[16px] transition-all flex items-center justify-center font-bold text-sm px-1 truncate
                  ${isActive ? 'bg-[#5865f2] text-white rounded-[16px]' : 'bg-[#313338] text-[#dbdee1] hover:bg-[#5865f2] hover:text-white'}"
                  title="${escapeHtml(srv.name)}">
                  ${escapeHtml(srv.name.slice(0, 3))}
                </button>
              `;
            }).join('')}

            <!-- サーバー作成・参加ボタン -->
            <button onclick="openServerModal()"
              class="w-12 h-12 rounded-[24px] hover:rounded-[16px] bg-[#313338] hover:bg-[#23a55a] text-[#23a55a] hover:text-white transition-all flex items-center justify-center text-2xl font-light"
              title="サーバーを作成または参加">
              +
            </button>
          </div>

          <!-- 2列目：チャンネル / DM / プロフィールフッター -->
          <div class="w-[230px] bg-[#2b2d31] flex flex-col justify-between h-full shrink-0">
            <div class="flex-1 overflow-y-auto">
              ${currentView.type === 'server' ? `
                <!-- サーバーヘッダー -->
                <div class="h-12 px-4 flex items-center justify-between border-b border-[#1f2023] font-bold text-white text-sm shadow-sm">
                  <span class="truncate">${escapeHtml(currentView.name)}</span>
                  <button onclick="copyInviteCode('${currentView.inviteCode}')" class="text-xs bg-[#35373c] hover:bg-[#404249] text-[#b5bac1] px-2 py-1 rounded shrink-0 ml-1" title="招待コードをコピー">
                    招待
                  </button>
                </div>
                <div class="p-2 space-y-1">
                  <div class="px-2 pt-2 pb-1 text-[11px] font-bold uppercase text-[#949ba4]">テキストチャンネル</div>
                  <button onclick="closeDrawerOnMobile()" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-md bg-[#404249] text-white text-sm font-medium">
                    <span class="text-[#80848e] text-lg">#</span>
                    <span>一般チャット</span>
                  </button>

                  <div class="px-2 pt-4 pb-1 text-[11px] font-bold uppercase text-[#949ba4]">メンバー (${serverMembers.length})</div>
                  <div class="space-y-1">
                    ${serverMembers.map(m => `
                      <div class="flex items-center gap-2.5 px-2 py-1.5 rounded hover:bg-[#35373c]">
                        ${renderAvatar(m, 'w-7 h-7', 'text-xs', true)}
                        <span class="text-sm text-[#dbdee1] truncate">${escapeHtml(m.username)}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : `
                <!-- ホーム（フレンド＆DMリスト） -->
                <div class="h-12 px-4 flex items-center border-b border-[#1f2023] font-bold text-white text-sm shadow-sm">
                  Raphael
                </div>
                <div class="p-2 space-y-1">
                  <button onclick="switchToFriends()"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium transition
                    ${currentView.type === 'friends' ? 'bg-[#404249] text-white' : 'text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]'}">
                    <span>👥</span>
                    <span>フレンド</span>
                    ${pendingRequests.length > 0 ? `<span class="ml-auto bg-[#da373c] text-white text-[11px] font-bold px-1.5 py-0.5 rounded-full">${pendingRequests.length}</span>` : ''}
                  </button>

                  <div class="px-2 pt-4 pb-1 text-[11px] font-bold uppercase text-[#949ba4]">ダイレクトメッセージ</div>
                  ${friends.length === 0 ? `<p class="px-3 py-2 text-xs text-[#949ba4]">フレンドを追加するとDMできます</p>` : ''}
                  ${friends.map(f => {
                    const dmRoomId = getDmRoomId(currentUser.id, f.id);
                    const isActive = currentView.type === 'dm' && currentView.id === dmRoomId;
                    return `
                      <button onclick="switchToDm('${f.id}', '${escapeJs(f.username)}')"
                        class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-md text-sm transition
                        ${isActive ? 'bg-[#404249] text-white' : 'text-[#949ba4] hover:bg-[#35373c] hover:text-[#dbdee1]'}">
                        ${renderAvatar(f, 'w-8 h-8', 'text-xs', true)}
                        <span class="truncate font-medium">${escapeHtml(f.username)}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- 左下：自分のプロフィールバー（タップで名前・アイコン編集！） -->
            <div class="h-[58px] bg-[#232428] px-2.5 flex items-center justify-between gap-2 border-t border-[#1e1f22]">
              <button onclick="openProfileModal()" class="flex items-center gap-2 min-w-0 flex-1 p-1 rounded-md hover:bg-[#35373c] text-left transition" title="プロフィールを編集">
                ${renderAvatar(currentProfile, 'w-8 h-8', 'text-xs', true)}
                <div class="min-w-0 flex-1">
                  <div class="text-xs font-bold text-white truncate">${escapeHtml(currentProfile?.username || '')}</div>
                  <div class="text-[11px] text-[#949ba4] truncate">#${escapeHtml(currentProfile?.friend_code || '0000')}</div>
                </div>
              </button>
              <button onclick="openProfileModal()" class="p-2 text-[#b5bac1] hover:text-white hover:bg-[#35373c] rounded-md shrink-0" title="プロフィール設定">
                ⚙️
              </button>
            </div>
          </div>
        </div>
      `;

      // メインコンテンツ（右側・スマホでは画面全体）
      let mainContentHTML = '';

      if (currentView.type === 'friends') {
        mainContentHTML = `
          <!-- フレンド画面ヘッダー -->
          <div class="h-12 px-3 bg-[#313338] border-b border-[#1f2023] flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <button onclick="toggleMobileDrawer()" class="md:hidden p-1.5 text-[#b5bac1] hover:text-white rounded bg-[#2b2d31] shrink-0">
                ☰
              </button>
              <span class="font-bold text-white text-sm shrink-0">👥 フレンド</span>
              <div class="flex items-center gap-1 overflow-x-auto no-scrollbar ml-1">
                <button onclick="setFriendTab('online')" class="px-2 py-1 rounded text-xs font-medium shrink-0 ${activeTab === 'online' ? 'bg-[#404249] text-white' : 'text-[#b5bac1] hover:bg-[#35373c]'}">オンライン</button>
                <button onclick="setFriendTab('all')" class="px-2 py-1 rounded text-xs font-medium shrink-0 ${activeTab === 'all' ? 'bg-[#404249] text-white' : 'text-[#b5bac1] hover:bg-[#35373c]'}">すべて</button>
                <button onclick="setFriendTab('pending')" class="px-2 py-1 rounded text-xs font-medium shrink-0 ${activeTab === 'pending' ? 'bg-[#404249] text-white' : 'text-[#b5bac1] hover:bg-[#35373c]'}">
                  申請中 ${pendingRequests.length > 0 ? `(${pendingRequests.length})` : ''}
                </button>
                <button onclick="setFriendTab('add')" class="px-2 py-1 rounded text-xs font-medium shrink-0 ${activeTab === 'add' ? 'bg-[#248046] text-white' : 'bg-[#248046]/80 text-white'}">追加</button>
              </div>
            </div>
            <button onclick="handleLogout()" class="text-xs text-[#949ba4] hover:text-red-400 shrink-0 px-2 py-1">ログアウト</button>
          </div>

          <!-- フレンド画面ボディ -->
          <div class="flex-1 overflow-y-auto p-4 bg-[#313338]">
            ${activeTab === 'add' ? `
              <div class="max-w-lg">
                <h2 class="text-sm font-bold text-white uppercase mb-1">フレンドを追加</h2>
                <p class="text-xs text-[#b5bac1] mb-3">
                  相手の「ユーザー名#4桁コード」を入力してください。<br>
                  あなたのID: <span class="text-white font-bold select-all">${escapeHtml(currentProfile?.username)}#${escapeHtml(currentProfile?.friend_code)}</span>
                </p>
                <div class="flex gap-2 bg-[#1e1f22] p-2 rounded-lg border border-[#1e1f22] focus-within:border-[#5865f2]">
                  <input id="friend-tag-input" type="text" placeholder="例: ユーザー名#1234"
                    class="flex-1 bg-transparent text-white text-sm outline-none px-2 min-w-0" />
                  <button onclick="sendFriendRequest()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-semibold px-3 py-2 rounded shrink-0">
                    申請送信
                  </button>
                </div>
              </div>
            ` : activeTab === 'pending' ? `
              <div class="max-w-lg space-y-2">
                <h2 class="text-xs font-bold text-[#b5bac1] uppercase mb-2">届いているフレンド申請 — ${pendingRequests.length}</h2>
                ${pendingRequests.length === 0 ? `<p class="text-sm text-[#949ba4] py-8 text-center">保留中のフレンド申請はありません</p>` : ''}
                ${pendingRequests.map(req => `
                  <div class="flex items-center justify-between p-3 rounded-lg bg-[#2b2d31] border border-[#3f4147]">
                    <div class="flex items-center gap-3 min-w-0">
                      ${renderAvatar(req, 'w-9 h-9', 'text-sm', true)}
                      <div class="min-w-0">
                        <div class="text-sm font-bold text-white truncate">${escapeHtml(req.username)}</div>
                        <div class="text-xs text-[#949ba4]">#${escapeHtml(req.friend_code)}</div>
                      </div>
                    </div>
                    <button onclick="acceptFriend('${req.friendship_id}')" class="bg-[#23a55a] hover:bg-[#1a7f42] text-white text-xs font-bold px-3 py-1.5 rounded shrink-0">
                      承認
                    </button>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div class="max-w-lg space-y-2">
                ${(() => {
                  const list = activeTab === 'online'
                    ? friends.filter(f => onlineUserIds.has(f.id))
                    : friends;
                  return `
                    <h2 class="text-xs font-bold text-[#b5bac1] uppercase mb-2">
                      ${activeTab === 'online' ? 'オンライン' : 'すべてのフレンド'} — ${list.length}
                    </h2>
                    ${list.length === 0 ? `<p class="text-sm text-[#949ba4] py-8 text-center">表示できるフレンドがいません。「追加」タブからフレンドを増やしましょう！</p>` : ''}
                    ${list.map(f => `
                      <div onclick="switchToDm('${f.id}', '${escapeJs(f.username)}')"
                        class="flex items-center justify-between p-3 rounded-lg hover:bg-[#35373c] border-t border-[#3f4147] cursor-pointer transition">
                        <div class="flex items-center gap-3 min-w-0">
                          ${renderAvatar(f, 'w-10 h-10', 'text-sm', true)}
                          <div class="min-w-0">
                            <div class="text-sm font-bold text-white truncate">${escapeHtml(f.username)}</div>
                            <div class="text-xs text-[#949ba4]">${onlineUserIds.has(f.id) ? 'オンライン' : 'オフライン'}</div>
                          </div>
                        </div>
                        <span class="bg-[#2b2d31] text-[#dbdee1] text-xs px-3 py-1.5 rounded-full shrink-0">💬 メッセージ</span>
                      </div>
                    `).join('')}
                  `;
                })()}
              </div>
            `}
          </div>
        `;
      } else {
        // チャット画面（サーバーチャット または DM）
        mainContentHTML = `
          <!-- チャットヘッダー -->
          <div class="h-12 px-3 bg-[#313338] border-b border-[#1f2023] flex items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-2 min-w-0">
              <button onclick="toggleMobileDrawer()" class="md:hidden p-1.5 text-[#b5bac1] hover:text-white rounded bg-[#2b2d31] shrink-0">
                ☰
              </button>
              <span class="text-[#80848e] font-bold text-lg shrink-0">${currentView.type === 'server' ? '#' : '@'}</span>
              <span class="font-bold text-white text-sm truncate">${escapeHtml(currentView.name)}</span>
            </div>
            ${currentView.type === 'server' ? `
              <button onclick="copyInviteCode('${currentView.inviteCode}')" class="text-xs bg-[#2b2d31] hover:bg-[#35373c] text-[#b5bac1] px-2.5 py-1 rounded shrink-0">
                招待コード: ${escapeHtml(currentView.inviteCode || '')}
              </button>
            ` : ''}
          </div>

          <!-- メッセージ一覧 -->
          <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[#313338]">
            ${messages.length === 0 ? `
              <div class="text-center text-xs text-[#949ba4] my-10">
                まだメッセージがありません。最初の挨拶を送ってみましょう！
              </div>
            ` : ''}
            ${messages.map(msg => {
              const sender = msg.sender || { username: '不明なユーザー', avatar_color: '#5865f2' };
              const timeStr = new Date(msg.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
              return `
                <div class="flex items-start gap-3">
                  ${renderAvatar(sender, 'w-10 h-10', 'text-sm', false)}
                  <div class="min-w-0 flex-1">
                    <div class="flex items-baseline gap-2">
                      <span class="font-bold text-white text-sm">${escapeHtml(sender.username)}</span>
                      <span class="text-[11px] text-[#949ba4]">${timeStr}</span>
                    </div>
                    <p class="text-sm text-[#dbdee1] break-words whitespace-pre-wrap mt-0.5">${escapeHtml(msg.content)}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- メッセージ入力欄 -->
          <div class="p-3 bg-[#313338] shrink-0">
            <form onsubmit="handleSendMessage(event)" class="flex items-center gap-2 bg-[#383a40] rounded-lg px-3 py-2">
              <input id="message-input" type="text" autocomplete="off"
                placeholder="${escapeHtml(currentView.name)} へメッセージを送信"
                class="flex-1 bg-transparent text-white text-sm outline-none min-w-0" />
              <button type="submit" class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold px-3.5 py-1.5 rounded-md shrink-0">
                送信
              </button>
            </form>
          </div>
        `;
      }

      app.innerHTML = `
        <div class="relative flex h-full w-full overflow-hidden">
          <!-- PC表示用常設サイドバー -->
          <div class="hidden md:flex h-full shrink-0">
            ${sidebarHTML}
          </div>

          <!-- スマホ表示用スライドドロワー -->
          ${mobileDrawerOpen ? `
            <div class="fixed inset-0 z-40 flex md:hidden">
              <div class="relative z-50 flex h-full shadow-2xl">
                ${sidebarHTML}
              </div>
              <div onclick="toggleMobileDrawer()" class="flex-1 bg-black/60"></div>
            </div>
          ` : ''}

          <!-- 右側メイン画面（スマホでは常に横幅100%で崩れない） -->
          <div class="flex-1 flex flex-col min-w-0 h-full bg-[#313338]">
            ${mainContentHTML}
          </div>
        </div>

        <!-- モーダル用コンテナ -->
        <div id="modal-root"></div>
      `;
    }

    // ==========================================
    // 5. プロフィール編集モーダル（名前＆アイコン変更）
    // ==========================================
    let tempAvatarDataUrl = null;
    let tempAvatarColor = '#5865f2';

    function openProfileModal() {
      tempAvatarDataUrl = currentProfile?.avatar_url || null;
      tempAvatarColor = currentProfile?.avatar_color || '#5865f2';
      const colors = ['#5865f2', '#23a55a', '#f0b232', '#da373c', '#eb459e', '#00a8fc'];

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
          <div class="w-full max-w-sm bg-[#313338] rounded-xl p-5 shadow-2xl border border-[#3f4147] max-h-[90dvh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-base font-bold text-white">プロフィール編集</h2>
              <button onclick="closeModal()" class="text-[#949ba4] hover:text-white text-lg">✕</button>
            </div>

            <!-- プレビュー -->
            <div class="flex flex-col items-center mb-4">
              <div id="avatar-preview-box" class="w-20 h-20 rounded-full overflow-hidden flex items-center justify-center text-white text-2xl font-bold shadow-md mb-3"
                style="background-color: ${tempAvatarColor};">
                ${tempAvatarDataUrl
                  ? `<img src="${tempAvatarDataUrl}" class="w-full h-full object-cover" />`
                  : escapeHtml((currentProfile?.username || '?').charAt(0).toUpperCase())
                }
              </div>

              <div class="flex gap-2">
                <label class="cursor-pointer bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-semibold px-3 py-1.5 rounded-md transition">
                  📷 画像を選ぶ
                  <input type="file" accept="image/*" onchange="handleAvatarFileChange(event)" class="hidden" />
                </label>
                ${tempAvatarDataUrl ? `
                  <button onclick="removeAvatarImage()" class="bg-[#da373c] hover:bg-[#a12828] text-white text-xs font-semibold px-3 py-1.5 rounded-md">
                    画像を削除
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- 背景カラー選択 -->
            <div class="mb-4">
              <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-2">アイコン背景カラー</label>
              <div class="flex items-center gap-2">
                ${colors.map(c => `
                  <button type="button" onclick="selectAvatarColor('${c}')"
                    class="w-7 h-7 rounded-full border-2 ${tempAvatarColor === c ? 'border-white scale-110' : 'border-transparent'}"
                    style="background-color: ${c};"></button>
                `).join('')}
              </div>
            </div>

            <!-- ユーザー名入力 -->
            <div class="mb-5">
              <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1.5">ユーザー名</label>
              <input id="edit-username-input" type="text" value="${escapeHtml(currentProfile?.username || '')}"
                class="w-full bg-[#1e1f22] text-white text-sm rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-[#5865f2]" />
            </div>

            <div class="flex gap-2">
              <button onclick="closeModal()" class="flex-1 bg-[#4e5058] hover:bg-[#6d6f78] text-white text-xs font-semibold py-2.5 rounded-lg">
                キャンセル
              </button>
              <button onclick="saveProfileChanges()" class="flex-1 bg-[#23a55a] hover:bg-[#1a7f42] text-white text-xs font-semibold py-2.5 rounded-lg">
                保存する
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function selectAvatarColor(color) {
      tempAvatarColor = color;
      const box = document.getElementById('avatar-preview-box');
      if (box) box.style.backgroundColor = color;
    }

    function removeAvatarImage() {
      tempAvatarDataUrl = null;
      const box = document.getElementById('avatar-preview-box');
      const nameVal = document.getElementById('edit-username-input')?.value || currentProfile?.username || '?';
      if (box) {
        box.innerHTML = escapeHtml(nameVal.charAt(0).toUpperCase());
      }
    }

    function handleAvatarFileChange(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // 128x128に自動リサイズして軽量保存
          const canvas = document.createElement('canvas');
          const size = 128;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          tempAvatarDataUrl = canvas.toDataURL('image/jpeg', 0.8);
          const box = document.getElementById('avatar-preview-box');
          if (box) {
            box.innerHTML = `<img src="${tempAvatarDataUrl}" class="w-full h-full object-cover" />`;
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveProfileChanges() {
      const newName = document.getElementById('edit-username-input').value.trim();
      if (!newName) return alert('ユーザー名を入力してください');

      const updatePayload = {
        username: newName,
        avatar_color: tempAvatarColor,
        avatar_url: tempAvatarDataUrl
      };

      const { error } = await supabase
        .from('profiles')
        .update(updatePayload)
        .eq('id', currentUser.id);

      if (error) {
        alert('保存エラー: ' + error.message + '\n※Supabaseで avatar_url 列を追加していない場合は、SQLを実行してください。');
        return;
      }

      currentProfile = { ...currentProfile, ...updatePayload };
      closeModal();
      renderMainApp();
    }

    // ==========================================
    // 6. サーバー作成・参加モーダル
    // ==========================================
    function openServerModal() {
      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
          <div class="w-full max-w-sm bg-[#313338] rounded-xl p-5 shadow-2xl border border-[#3f4147]">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-base font-bold text-white">サーバーを作成または参加</h2>
              <button onclick="closeModal()" class="text-[#949ba4] hover:text-white text-lg">✕</button>
            </div>

            <div class="space-y-4">
              <div class="bg-[#2b2d31] p-3.5 rounded-lg">
                <label class="block text-xs font-bold text-white mb-2">新しくサーバーを作る</label>
                <div class="flex gap-2">
                  <input id="new-server-name" type="text" placeholder="サーバー名"
                    class="flex-1 bg-[#1e1f22] text-white text-sm rounded px-3 py-2 outline-none min-w-0" />
                  <button onclick="createServer()" class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-xs font-bold px-3.5 py-2 rounded shrink-0">
                    作成
                  </button>
                </div>
              </div>

              <div class="bg-[#2b2d31] p-3.5 rounded-lg">
                <label class="block text-xs font-bold text-white mb-2">招待コードで参加する</label>
                <div class="flex gap-2">
                  <input id="join-invite-code" type="text" placeholder="例: AB12CD"
                    class="flex-1 bg-[#1e1f22] text-white text-sm rounded px-3 py-2 outline-none min-w-0" />
                  <button onclick="joinServer()" class="bg-[#23a55a] hover:bg-[#1a7f42] text-white text-xs font-bold px-3.5 py-2 rounded shrink-0">
                    参加
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function createServer() {
      const name = document.getElementById('new-server-name').value.trim();
      if (!name) return alert('サーバー名を入力してください');

      const inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      const { data: srv, error } = await supabase
        .from('servers')
        .insert({ name, invite_code: inviteCode, owner_id: currentUser.id })
        .select()
        .single();

      if (error) return alert('作成エラー: ' + error.message);

      await supabase.from('server_members').insert({
        server_id: srv.id,
        user_id: currentUser.id
      });

      await fetchServers();
      closeModal();
      switchToServer(srv.id, srv.name, srv.invite_code);
    }

    async function joinServer() {
      const code = document.getElementById('join-invite-code').value.trim().toUpperCase();
      if (!code) return alert('招待コードを入力してください');

      const { data: srv, error } = await supabase
        .from('servers')
        .select('*')
        .eq('invite_code', code)
        .single();

      if (error || !srv) return alert('招待コードが見つかりませんでした');

      await supabase.from('server_members').upsert({
        server_id: srv.id,
        user_id: currentUser.id
      });

      await fetchServers();
      closeModal();
      switchToServer(srv.id, srv.name, srv.invite_code);
    }

    function closeModal() {
      const modalRoot = document.getElementById('modal-root');
      if (modalRoot) modalRoot.innerHTML = '';
    }

    // ==========================================
    // 7. 画面切り替え・メッセージ送信・フレンド操作
    // ==========================================
    function toggleMobileDrawer() {
      mobileDrawerOpen = !mobileDrawerOpen;
      renderMainApp();
    }

    function closeDrawerOnMobile() {
      if (mobileDrawerOpen) {
        mobileDrawerOpen = false;
        renderMainApp();
      }
    }

    function setFriendTab(tab) {
      activeTab = tab;
      renderMainApp();
    }

    async function switchToFriends() {
      currentView = { type: 'friends', id: null, name: 'フレンド' };
      mobileDrawerOpen = false;
      await fetchFriends();
      renderMainApp();
    }

    async function switchToServer(serverId, serverName, inviteCode) {
      currentView = { type: 'server', id: serverId, name: serverName, inviteCode };
      mobileDrawerOpen = false;

      const [{ data: msgs }, { data: members }] = await Promise.all([
        supabase
          .from('messages')
          .select('*, sender:profiles(*)')
          .eq('server_id', serverId)
          .order('created_at', { ascending: true })
          .limit(100),
        supabase
          .from('server_members')
          .select('profiles(*)')
          .eq('server_id', serverId)
      ]);

      messages = msgs || [];
      serverMembers = (members || []).map(m => m.profiles).filter(Boolean);
      renderMainApp();
      scrollToBottom();
    }

    async function switchToDm(friendId, friendName) {
      const dmRoomId = getDmRoomId(currentUser.id, friendId);
      currentView = { type: 'dm', id: dmRoomId, name: friendName };
      mobileDrawerOpen = false;

      const { data: msgs } = await supabase
        .from('messages')
        .select('*, sender:profiles(*)')
        .eq('dm_id', dmRoomId)
        .order('created_at', { ascending: true })
        .limit(100);

      messages = msgs || [];
      renderMainApp();
      scrollToBottom();
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';

      const payload = {
        room_id: currentView.id,
        sender_id: currentUser.id,
        content
      };
      if (currentView.type === 'server') {
        payload.server_id = currentView.id;
      } else {
        payload.dm_id = currentView.id;
      }

      const { error } = await supabase.from('messages').insert(payload);
      if (error) {
        alert('送信エラー: ' + error.message);
      }
    }

    async function sendFriendRequest() {
      const input = document.getElementById('friend-tag-input').value.trim();
      const parts = input.split('#');
      if (parts.length !== 2) {
        alert('「ユーザー名#4桁コード」の形式で入力してください（例: 太郎#1234）');
        return;
      }
      const [targetName, targetCode] = parts;

      const { data: targetUser } = await supabase
        .from('profiles')
        .select('*')
        .eq('username', targetName)
        .eq('friend_code', targetCode)
        .single();

      if (!targetUser) return alert('ユーザーが見つかりませんでした');
      if (targetUser.id === currentUser.id) return alert('自分自身には申請できません');

      const { error } = await supabase.from('friendships').insert({
        requester_id: currentUser.id,
        addressee_id: targetUser.id,
        status: 'pending'
      });

      if (error) return alert('すでに申請済みか、フレンドになっています');
      alert(`${targetName}#${targetCode} にフレンド申請を送りました！`);
      document.getElementById('friend-tag-input').value = '';
    }

    async function acceptFriend(friendshipId) {
      await supabase
        .from('friendships')
        .update({ status: 'accepted' })
        .eq('id', friendshipId);
      await fetchFriends();
      renderMainApp();
    }

    function copyInviteCode(code) {
      navigator.clipboard?.writeText(code);
      alert('招待コード「' + code + '」をコピーしました！友達に教えてあげてください。');
    }

    function getDmRoomId(id1, id2) {
      return [id1, id2].sort().join('_');
    }

    function scrollToBottom() {
      setTimeout(() => {
        const container = document.getElementById('messages-container');
        if (container) container.scrollTop = container.scrollHeight;
      }, 50);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/'/g, "\'");
    }

    // アプリ起動
    init();
  </script>
</body>
</html>
