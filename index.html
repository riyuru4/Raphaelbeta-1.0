<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Raphael</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #313338;
      color: #f2f3f5;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      overscroll-behavior-y: none;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 3px; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

  <!-- 1. 初期セットアップ画面 -->
  <div id="setup-screen" class="hidden h-full w-full flex items-center justify-center p-4 bg-[#1e1f22] overflow-y-auto">
    <div class="bg-[#313338] p-6 rounded-lg shadow-xl w-full max-w-md border border-[#3f4147]">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-[#5865F2] rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3">R</div>
        <h1 class="text-xl font-bold text-white">Raphael 初期セットアップ</h1>
        <p class="text-xs text-[#b5bac1] mt-1">Supabaseの接続情報を入力してください（一度保存すると次回から自動接続します）</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1">Project URL</label>
          <input type="text" id="setup-url" placeholder="https://xxxx.supabase.co" class="w-full bg-[#1e1f22] text-white p-3 rounded border border-[#1e1f22] focus:border-[#5865F2] focus:outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1">Anon Public Key</label>
          <input type="text" id="setup-key" placeholder="sb_publishable_... または eyJhb..." class="w-full bg-[#1e1f22] text-white p-3 rounded border border-[#1e1f22] focus:border-[#5865F2] focus:outline-none text-sm">
        </div>
        <button onclick="saveSetup()" class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold py-3 rounded transition">保存して次へ</button>
      </div>
    </div>
  </div>

  <!-- 2. ログイン・新規登録画面 -->
  <div id="auth-screen" class="hidden h-full w-full flex items-center justify-center p-4 bg-[#1e1f22] overflow-y-auto">
    <div class="bg-[#313338] p-6 rounded-lg shadow-xl w-full max-w-md border border-[#3f4147]">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-[#5865F2] rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3">R</div>
        <h1 id="auth-title" class="text-2xl font-bold text-white">Raphael へようこそ！</h1>
        <p id="auth-subtitle" class="text-sm text-[#b5bac1] mt-1">アカウントにログインしてください</p>
      </div>
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="username-field" class="hidden">
          <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1">ユーザー名</label>
          <input type="text" id="auth-username" placeholder="表示される名前" class="w-full bg-[#1e1f22] text-white p-3 rounded border border-[#1e1f22] focus:border-[#5865F2] focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1">メールアドレス</label>
          <input type="email" id="auth-email" required placeholder="mail@example.com" class="w-full bg-[#1e1f22] text-white p-3 rounded border border-[#1e1f22] focus:border-[#5865F2] focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1">パスワード（6文字以上）</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full bg-[#1e1f22] text-white p-3 rounded border border-[#1e1f22] focus:border-[#5865F2] focus:outline-none">
        </div>
        <button type="submit" id="auth-submit-btn" class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold py-3 rounded transition">ログイン</button>
      </form>
      <div class="mt-4 text-center">
        <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-sm text-[#00a8fc] hover:underline">アカウント登録はこちら</button>
      </div>
      <div class="mt-6 pt-4 border-t border-[#3f4147] text-center">
        <button type="button" onclick="resetSetup()" class="text-xs text-[#949ba4] hover:text-white">Supabase接続設定をやり直す</button>
      </div>
    </div>
  </div>

  <!-- 3. メインアプリ画面 -->
  <div id="app-screen" class="hidden h-full w-full flex relative overflow-hidden">
    
    <!-- モバイル用背景オーバーレイ -->
    <div id="mobile-overlay" onclick="closeMobileMenu()" class="hidden fixed inset-0 bg-black/60 z-20 md:hidden"></div>

    <!-- 左サイドバー（スマホではスライド開閉、PCでは常時表示） -->
    <div id="left-sidebar" class="fixed inset-y-0 left-0 z-30 flex h-full transform -translate-x-full transition-transform duration-200 ease-in-out md:relative md:translate-x-0">
      
      <!-- サーバー一覧バー -->
      <div class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 space-y-2 overflow-y-auto shrink-0">
        <!-- ホーム（フレンド・DM）ボタン -->
        <button onclick="selectHome()" id="home-btn" class="w-12 h-12 rounded-[16px] bg-[#5865F2] text-white flex items-center justify-center font-bold text-xl transition-all hover:rounded-[16px]" title="ダイレクトメッセージ・フレンド">
          R
        </button>
        <div class="w-8 h-[2px] bg-[#35363c] rounded-full my-1"></div>
        <!-- 参加中のサーバー一覧 -->
        <div id="server-list" class="flex flex-col items-center space-y-2 w-full"></div>
        <!-- サーバー追加・参加ボタン -->
        <button onclick="openServerModal()" class="w-12 h-12 rounded-[24px] bg-[#313338] hover:bg-[#23a55a] text-[#23a55a] hover:text-white flex items-center justify-center text-2xl transition-all hover:rounded-[16px]" title="サーバーを追加・参加">
          +
        </button>
      </div>

      <!-- チャンネル / DM 一覧 & プロフィールバー -->
      <div class="w-60 bg-[#2b2d31] flex flex-col h-full shrink-0">
        <!-- 上部ヘッダー -->
        <div id="sidebar-header" class="h-12 px-4 border-b border-[#1f2023] flex items-center justify-between font-bold text-white shadow-sm shrink-0">
          <span id="sidebar-title" class="truncate">フレンド</span>
          <button id="invite-btn" onclick="copyInviteCode()" class="hidden text-xs bg-[#5865F2] hover:bg-[#4752c4] px-2 py-1 rounded text-white shrink-0">招待コード</button>
        </div>

        <!-- 中央リスト（DM一覧 or サーバーチャンネル） -->
        <div id="sidebar-content" class="flex-1 overflow-y-auto p-2 space-y-1"></div>

        <!-- 下部：自分のプロフィールバー（タップで名前・アイコン編集） -->
        <div class="h-14 bg-[#232428] px-2 flex items-center justify-between shrink-0">
          <div onclick="openProfileModal()" class="flex items-center space-x-2 p-1 rounded hover:bg-[#35373c] cursor-pointer flex-1 min-w-0">
            <div class="relative shrink-0">
              <div id="my-avatar" class="w-8 h-8 rounded-full bg-[#5865F2] flex items-center justify-center text-white font-bold text-sm overflow-hidden bg-cover bg-center">?</div>
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#23a55a] border-2 border-[#232428] rounded-full"></span>
            </div>
            <div class="min-w-0 flex-1">
              <div id="my-username" class="text-sm font-bold text-white truncate">読み込み中...</div>
              <div id="my-friend-code" class="text-[11px] text-[#b5bac1] truncate">#0000</div>
            </div>
          </div>
          <button onclick="openProfileModal()" class="p-2 text-[#b5bac1] hover:text-white hover:bg-[#35373c] rounded" title="プロフィール編集">
            ⚙️
          </button>
        </div>
      </div>
    </div>

    <!-- 右メインエリア -->
    <div class="flex-1 flex flex-col bg-[#313338] h-full min-w-0">
      
      <!-- トップナビゲーションバー -->
      <div class="h-12 px-3 border-b border-[#1f2023] flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-2 min-w-0">
          <!-- スマホ用メニュー開閉ボタン -->
          <button onclick="openMobileMenu()" class="md:hidden p-2 -ml-1 text-[#b5bac1] hover:text-white text-xl leading-none">
            ☰
          </button>
          <span id="main-header-icon" class="text-[#80848e] font-bold text-lg">#</span>
          <h2 id="main-header-title" class="font-bold text-white truncate">フレンド</h2>
        </div>
        <button onclick="handleLogout()" class="text-xs text-[#f23f42] hover:underline px-2 py-1 shrink-0">ログアウト</button>
      </div>

      <!-- ビューA：フレンド管理画面 -->
      <div id="friends-view" class="flex-1 overflow-y-auto p-4 space-y-6">
        <!-- フレンド追加フォーム -->
        <div class="bg-[#2b2d31] p-4 rounded-lg border border-[#1f2023]">
          <h3 class="text-sm font-bold text-white uppercase mb-1">フレンドを追加</h3>
          <p class="text-xs text-[#b5bac1] mb-3">相手の「ユーザー名#4桁コード」を入力して申請します（あなたのID: <span id="display-my-tag" class="text-white font-mono font-bold"></span>）</p>
          <form onsubmit="sendFriendRequest(event)" class="flex flex-col sm:flex-row gap-2">
            <input type="text" id="friend-tag-input" placeholder="例: ユーザー名#1234" required class="flex-1 bg-[#1e1f22] text-white px-3 py-2.5 rounded border border-[#1e1f22] focus:border-[#5865F2] focus:outline-none text-sm">
            <button type="submit" class="bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold px-4 py-2.5 rounded text-sm shrink-0">フレンド申請を送る</button>
          </form>
        </div>

        <!-- 承認待ちの申請 -->
        <div id="pending-requests-section" class="hidden space-y-2">
          <h3 class="text-xs font-bold text-[#b5bac1] uppercase">届いているフレンド申請</h3>
          <div id="pending-requests-list" class="space-y-2"></div>
        </div>

        <!-- フレンド一覧 -->
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-[#b5bac1] uppercase">すべてのフレンド</h3>
          <div id="friends-list" class="space-y-2">
            <p class="text-sm text-[#949ba4]">フレンドがまだいません。</p>
          </div>
        </div>
      </div>

      <!-- ビューB：チャット画面（サーバー & DM共通） -->
      <div id="chat-view" class="hidden flex-1 flex flex-col min-h-0">
        <!-- メッセージ一覧 -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        
        <!-- メッセージ入力フォーム -->
        <div class="p-3 bg-[#313338] shrink-0">
          <form onsubmit="sendMessage(event)" class="flex items-center bg-[#383a40] rounded-lg px-3 py-2 gap-2">
            <input type="text" id="message-input" placeholder="メッセージを送信" autocomplete="off" class="flex-1 bg-transparent text-white focus:outline-none text-sm min-w-0">
            <button type="submit" class="bg-[#5865F2] hover:bg-[#4752c4] text-white text-xs font-bold px-3 py-2 rounded shrink-0">送信</button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <!-- モーダル1：サーバー作成 / 参加 -->
  <div id="server-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-[#313338] rounded-lg w-full max-w-md p-6 border border-[#3f4147] space-y-5">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">サーバーの作成・参加</h3>
        <button onclick="closeServerModal()" class="text-[#b5bac1] hover:text-white text-xl">✕</button>
      </div>
      
      <!-- 新規作成 -->
      <form onsubmit="createServer(event)" class="space-y-2">
        <label class="block text-xs font-bold uppercase text-[#b5bac1]">新しいサーバーを作る</label>
        <div class="flex gap-2">
          <input type="text" id="new-server-name" placeholder="サーバー名（例: 雑談部屋）" required class="flex-1 bg-[#1e1f22] text-white p-2.5 rounded text-sm focus:outline-none">
          <button type="submit" class="bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold px-4 rounded text-sm shrink-0">作成</button>
        </div>
      </form>

      <div class="border-t border-[#3f4147]"></div>

      <!-- 招待コードで参加 -->
      <form onsubmit="joinServer(event)" class="space-y-2">
        <label class="block text-xs font-bold uppercase text-[#b5bac1]">招待コードで参加する</label>
        <div class="flex gap-2">
          <input type="text" id="join-invite-code" placeholder="6桁の招待コード" required class="flex-1 bg-[#1e1f22] text-white p-2.5 rounded text-sm focus:outline-none">
          <button type="submit" class="bg-[#23a55a] hover:bg-[#1a7f42] text-white font-bold px-4 rounded text-sm shrink-0">参加</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル2：プロフィール編集（名前・アイコン画像・カラー変更） -->
  <div id="profile-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-[#313338] rounded-lg w-full max-w-md p-6 border border-[#3f4147] space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">プロフィール編集</h3>
        <button onclick="closeProfileModal()" class="text-[#b5bac1] hover:text-white text-xl">✕</button>
      </div>

      <!-- アイコンプレビュー & 画像選択 -->
      <div class="flex flex-col items-center space-y-3">
        <div id="edit-avatar-preview" class="w-20 h-20 rounded-full bg-[#5865F2] flex items-center justify-center text-white text-3xl font-bold overflow-hidden bg-cover bg-center border-4 border-[#1e1f22]">?</div>
        <div class="flex gap-2">
          <label class="bg-[#5865F2] hover:bg-[#4752c4] text-white text-xs font-bold px-3 py-2 rounded cursor-pointer">
            画像を選択
            <input type="file" id="avatar-file-input" accept="image/*" onchange="handleAvatarFile(event)" class="hidden">
          </label>
          <button type="button" onclick="clearAvatarImage()" class="bg-[#4e5058] hover:bg-[#6d6f78] text-white text-xs font-bold px-3 py-2 rounded">画像を解除</button>
        </div>
      </div>

      <!-- アイコン背景色選択 -->
      <div>
        <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-2">アイコンカラー（画像未設定時）</label>
        <div class="flex items-center gap-2 flex-wrap">
          <button type="button" onclick="selectAvatarColor('#5865F2')" class="w-8 h-8 rounded-full bg-[#5865F2] border-2 border-white"></button>
          <button type="button" onclick="selectAvatarColor('#23a55a')" class="w-8 h-8 rounded-full bg-[#23a55a]"></button>
          <button type="button" onclick="selectAvatarColor('#f23f42')" class="w-8 h-8 rounded-full bg-[#f23f42]"></button>
          <button type="button" onclick="selectAvatarColor('#f0b232')" class="w-8 h-8 rounded-full bg-[#f0b232]"></button>
          <button type="button" onclick="selectAvatarColor('#eb459e')" class="w-8 h-8 rounded-full bg-[#eb459e]"></button>
          <button type="button" onclick="selectAvatarColor('#1abc9c')" class="w-8 h-8 rounded-full bg-[#1abc9c]"></button>
          <input type="color" id="edit-avatar-color" value="#5865F2" onchange="selectAvatarColor(this.value)" class="w-8 h-8 bg-transparent border-0 cursor-pointer">
        </div>
      </div>

      <!-- ユーザー名変更 -->
      <div>
        <label class="block text-xs font-bold uppercase text-[#b5bac1] mb-1">ユーザー名</label>
        <input type="text" id="edit-username-input" required class="w-full bg-[#1e1f22] text-white p-3 rounded text-sm focus:outline-none border border-[#1e1f22] focus:border-[#5865F2]">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeProfileModal()" class="px-4 py-2 text-sm text-[#b5bac1] hover:text-white">キャンセル</button>
        <button type="button" onclick="saveProfile()" id="save-profile-btn" class="bg-[#23a55a] hover:bg-[#1a7f42] text-white font-bold px-5 py-2 rounded text-sm">変更を保存</button>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;
    let currentUser = null;
    let myProfile = null;
    let isSignUpMode = false;
    let currentView = 'home'; // 'home' or 'server'
    let activeServer = null;
    let activeDmUser = null;
    let onlineUsers = new Set();
    let messageChannel = null;
    let presenceChannel = null;

    // プロフィール編集用一時変数
    let tempAvatarUrl = null;
    let tempAvatarColor = '#5865F2';

    // 初期化処理
    window.addEventListener('DOMContentLoaded', async () => {
      const url = localStorage.getItem('raphael_supabase_url');
      const key = localStorage.getItem('raphael_supabase_key');

      if (!url || !key) {
        showScreen('setup-screen');
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(url, key);
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;

        if (session && session.user) {
          currentUser = session.user;
          await initApp();
        } else {
          showScreen('auth-screen');
        }
      } catch (err) {
        console.error(err);
        showScreen('setup-screen');
      }
    });

    function showScreen(screenId) {
      ['setup-screen', 'auth-screen', 'app-screen'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    // セットアップ保存
    function saveSetup() {
      const url = document.getElementById('setup-url').value.trim();
      const key = document.getElementById('setup-key').value.trim();
      if (!url || !key) return alert('URLとキーの両方を入力してください。');
      localStorage.setItem('raphael_supabase_url', url);
      localStorage.setItem('raphael_supabase_key', key);
      location.reload();
    }

    function resetSetup() {
      localStorage.removeItem('raphael_supabase_url');
      localStorage.removeItem('raphael_supabase_key');
      location.reload();
    }

    // 認証モード切替
    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').textContent = isSignUpMode ? 'アカウントを作成' : 'Raphael へようこそ！';
      document.getElementById('auth-subtitle').textContent = isSignUpMode ? '新しいプロフィールを登録します' : 'アカウントにログインしてください';
      document.getElementById('auth-submit-btn').textContent = isSignUpMode ? '登録して始める' : 'ログイン';
      document.getElementById('auth-toggle-btn').textContent = isSignUpMode ? 'すでにアカウントをお持ちの方はこちら' : 'アカウント登録はこちら';
      document.getElementById('username-field').classList.toggle('hidden', !isSignUpMode);
    }

    // ログイン / 新規登録処理
    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const username = document.getElementById('auth-username').value.trim();
      const btn = document.getElementById('auth-submit-btn');
      btn.disabled = true;

      try {
        if (isSignUpMode) {
          if (!username) {
            alert('ユーザー名を入力してください');
            btn.disabled = false;
            return;
          }
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { username } }
          });
          if (error) throw error;
          if (data.user) {
            const friendCode = String(Math.floor(1000 + Math.random() * 9000));
            await supabaseClient.from('profiles').upsert({
              id: data.user.id,
              username: username,
              friend_code: friendCode
            });
            currentUser = data.user;
            await initApp();
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          currentUser = data.user;
          await initApp();
        }
      } catch (err) {
        alert('エラー: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function handleLogout() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      location.reload();
    }

    // アプリ初期化
    async function initApp() {
      showScreen('app-screen');
      await loadMyProfile();
      setupPresence();
      await loadServers();
      selectHome();
    }

    // 自分のプロフィール読み込み（無ければ自動生成）
    async function loadMyProfile() {
      let { data, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (!data) {
        const defaultName = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
        const friendCode = String(Math.floor(1000 + Math.random() * 9000));
        const res = await supabaseClient.from('profiles').insert({
          id: currentUser.id,
          username: defaultName,
          friend_code: friendCode
        }).select().single();
        data = res.data;
      }

      myProfile = data;
      renderMyProfile();
    }

    function renderMyProfile() {
      if (!myProfile) return;
      document.getElementById('my-username').textContent = myProfile.username;
      document.getElementById('my-friend-code').textContent = '#' + myProfile.friend_code;
      document.getElementById('display-my-tag').textContent = `${myProfile.username}#${myProfile.friend_code}`;
      applyAvatarStyle(document.getElementById('my-avatar'), myProfile);
    }

    function applyAvatarStyle(el, profile) {
      if (!el || !profile) return;
      if (profile.avatar_url) {
        el.style.backgroundImage = `url(${profile.avatar_url})`;
        el.style.backgroundColor = 'transparent';
        el.textContent = '';
      } else {
        el.style.backgroundImage = 'none';
        el.style.backgroundColor = profile.avatar_color || '#5865F2';
        el.textContent = (profile.username || '?').charAt(0).toUpperCase();
      }
    }

    // オンライン状態監視
    function setupPresence() {
      if (presenceChannel) supabaseClient.removeChannel(presenceChannel);
      presenceChannel = supabaseClient.channel('online-users', {
        config: { presence: { key: currentUser.id } }
      });

      presenceChannel
        .on('presence', { event: 'sync' }, () => {
          const state = presenceChannel.presenceState();
          onlineUsers = new Set(Object.keys(state));
          if (currentView === 'home' && !activeDmUser) {
            loadFriends();
          }
        })
        .subscribe(async (status) => {
          if (status === 'SUBSCRIBED') {
            await presenceChannel.track({ online_at: new Date().toISOString() });
          }
        });
    }

    // モバイルメニュー制御
    function openMobileMenu() {
      document.getElementById('left-sidebar').classList.remove('-translate-x-full');
      document.getElementById('mobile-overlay').classList.remove('hidden');
    }

    function closeMobileMenu() {
      document.getElementById('left-sidebar').classList.add('-translate-x-full');
      document.getElementById('mobile-overlay').classList.add('hidden');
    }

    // ホーム（フレンド＆DM）選択
    async function selectHome() {
      currentView = 'home';
      activeServer = null;
      activeDmUser = null;
      closeMobileMenu();

      document.getElementById('sidebar-title').textContent = 'フレンド';
      document.getElementById('invite-btn').classList.add('hidden');
      document.getElementById('main-header-icon').textContent = '👥';
      document.getElementById('main-header-title').textContent = 'フレンド';

      document.getElementById('friends-view').classList.remove('hidden');
      document.getElementById('chat-view').classList.add('hidden');

      await loadFriends();
    }

    // サーバー一覧読み込み
    async function loadServers() {
      const { data } = await supabaseClient
        .from('server_members')
        .select('server_id, servers(id, name, invite_code)')
        .eq('user_id', currentUser.id);

      const listEl = document.getElementById('server-list');
      listEl.innerHTML = '';

      if (data) {
        data.forEach(item => {
          const srv = item.servers;
          if (!srv) return;
          const btn = document.createElement('button');
          btn.className = 'w-12 h-12 rounded-[24px] bg-[#313338] hover:bg-[#5865F2] text-white font-bold flex items-center justify-center transition-all hover:rounded-[16px] text-sm px-1 truncate';
          btn.textContent = srv.name.slice(0, 3);
          btn.title = srv.name;
          btn.onclick = () => selectServer(srv);
          listEl.appendChild(btn);
        });
      }
    }

    // サーバー選択
    async function selectServer(server) {
      currentView = 'server';
      activeServer = server;
      activeDmUser = null;
      closeMobileMenu();

      document.getElementById('sidebar-title').textContent = server.name;
      document.getElementById('invite-btn').classList.remove('hidden');
      document.getElementById('sidebar-content').innerHTML = `
        <div class="px-2 py-1.5 rounded bg-[#35373c] text-white font-medium text-sm flex items-center space-x-2">
          <span class="text-[#80848e]">#</span>
          <span>一般チャット</span>
        </div>
      `;

      document.getElementById('main-header-icon').textContent = '#';
      document.getElementById('main-header-title').textContent = server.name;
      document.getElementById('message-input').placeholder = `${server.name} へメッセージを送信`;

      document.getElementById('friends-view').classList.add('hidden');
      document.getElementById('chat-view').classList.remove('hidden');

      await loadMessages();
      subscribeMessages();
    }

    function copyInviteCode() {
      if (!activeServer) return;
      navigator.clipboard.writeText(activeServer.invite_code);
      alert(`招待コード「${activeServer.invite_code}」をコピーしました！友達に教えてください。`);
    }

    // サーバー作成・参加モーダル
    function openServerModal() {
      document.getElementById('server-modal').classList.remove('hidden');
    }
    function closeServerModal() {
      document.getElementById('server-modal').classList.add('hidden');
    }

    async function createServer(e) {
      e.preventDefault();
      const name = document.getElementById('new-server-name').value.trim();
      if (!name) return;
      const inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();

      const { data: srv, error } = await supabaseClient
        .from('servers')
        .insert({ name, invite_code: inviteCode, owner_id: currentUser.id })
        .select()
        .single();

      if (error) return alert('作成エラー: ' + error.message);

      await supabaseClient.from('server_members').insert({
        server_id: srv.id,
        user_id: currentUser.id
      });

      document.getElementById('new-server-name').value = '';
      closeServerModal();
      await loadServers();
      selectServer(srv);
    }

    async function joinServer(e) {
      e.preventDefault();
      const code = document.getElementById('join-invite-code').value.trim().toUpperCase();
      if (!code) return;

      const { data: srv, error } = await supabaseClient
        .from('servers')
        .select('*')
        .eq('invite_code', code)
        .single();

      if (error || !srv) return alert('招待コードが見つかりませんでした。');

      await supabaseClient.from('server_members').upsert({
        server_id: srv.id,
        user_id: currentUser.id
      });

      document.getElementById('join-invite-code').value = '';
      closeServerModal();
      await loadServers();
      selectServer(srv);
    }

    // フレンド機能
    async function loadFriends() {
      const { data: friendships } = await supabaseClient
        .from('friendships')
        .select(`
          id, status, requester_id, addressee_id,
          requester:profiles!friendships_requester_id_fkey(id, username, friend_code, avatar_color, avatar_url),
          addressee:profiles!friendships_addressee_id_fkey(id, username, friend_code, avatar_color, avatar_url)
        `)
        .or(`requester_id.eq.${currentUser.id},addressee_id.eq.${currentUser.id}`);

      const pendingSection = document.getElementById('pending-requests-section');
      const pendingList = document.getElementById('pending-requests-list');
      const friendsList = document.getElementById('friends-list');
      const sidebarContent = document.getElementById('sidebar-content');

      pendingList.innerHTML = '';
      friendsList.innerHTML = '';
      if (currentView === 'home') {
        sidebarContent.innerHTML = '<div class="text-xs font-bold text-[#949ba4] px-2 py-1">ダイレクトメッセージ</div>';
      }

      let hasPending = false;
      let hasFriends = false;

      if (friendships) {
        friendships.forEach(f => {
          if (f.status === 'pending' && f.addressee_id === currentUser.id) {
            hasPending = true;
            const user = f.requester;
            const div = document.createElement('div');
            div.className = 'bg-[#2b2d31] p-3 rounded flex items-center justify-between';
            div.innerHTML = `
              <div class="flex items-center space-x-2">
                <span class="font-bold text-white text-sm">${user.username}#${user.friend_code}</span>
              </div>
              <button onclick="acceptFriend('${f.id}')" class="bg-[#23a55a] hover:bg-[#1a7f42] text-white text-xs font-bold px-3 py-1.5 rounded">承認</button>
            `;
            pendingList.appendChild(div);
          } else if (f.status === 'accepted') {
            hasFriends = true;
            const friend = f.requester_id === currentUser.id ? f.addressee : f.requester;
            const isOnline = onlineUsers.has(friend.id);

            // メイン一覧に追加
            const card = document.createElement('div');
            card.className = 'bg-[#2b2d31] hover:bg-[#35373c] p-3 rounded flex items-center justify-between cursor-pointer';
            card.onclick = () => openDm(friend);
            card.innerHTML = `
              <div class="flex items-center space-x-3">
                <div class="relative">
                  <div class="friend-av w-10 h-10 rounded-full flex items-center justify-center text-white font-bold overflow-hidden bg-cover bg-center"></div>
                  <span class="absolute bottom-0 right-0 w-3 h-3 ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'} border-2 border-[#2b2d31] rounded-full"></span>
                </div>
                <div>
                  <div class="font-bold text-white text-sm">${friend.username} <span class="text-xs text-[#949ba4] font-normal">#${friend.friend_code}</span></div>
                  <div class="text-xs ${isOnline ? 'text-[#23a55a]' : 'text-[#949ba4]'}">${isOnline ? 'オンライン' : 'オフライン'}</div>
                </div>
              </div>
              <span class="text-xs bg-[#1e1f22] text-[#b5bac1] px-2.5 py-1.5 rounded">メッセージ</span>
            `;
            applyAvatarStyle(card.querySelector('.friend-av'), friend);
            friendsList.appendChild(card);

            // サイドバーDM欄にも追加
            if (currentView === 'home') {
              const dmBtn = document.createElement('button');
              dmBtn.className = 'w-full flex items-center space-x-2 px-2 py-1.5 rounded hover:bg-[#35373c] text-left';
              dmBtn.onclick = () => openDm(friend);
              dmBtn.innerHTML = `
                <div class="relative shrink-0">
                  <div class="dm-av w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold overflow-hidden bg-cover bg-center"></div>
                  <span class="absolute bottom-0 right-0 w-2 h-2 ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'} rounded-full"></span>
                </div>
                <span class="text-sm text-[#dbdee1] truncate">${friend.username}</span>
              `;
              applyAvatarStyle(dmBtn.querySelector('.dm-av'), friend);
              sidebarContent.appendChild(dmBtn);
            }
          }
        });
      }

      pendingSection.classList.toggle('hidden', !hasPending);
      if (!hasFriends) {
        friendsList.innerHTML = '<p class="text-sm text-[#949ba4]">フレンドがまだいません。上のフォームから申請してみましょう！</p>';
      }
    }

    async function sendFriendRequest(e) {
      e.preventDefault();
      const input = document.getElementById('friend-tag-input').value.trim();
      const parts = input.split('#');
      if (parts.length !== 2) return alert('「ユーザー名#4桁コード」の形式で入力してください。');

      const [targetName, targetCode] = parts;
      const { data: targetUser, error } = await supabaseClient
        .from('profiles')
        .select('id')
        .eq('username', targetName)
        .eq('friend_code', targetCode)
        .single();

      if (error || !targetUser) return alert('ユーザーが見つかりませんでした。名前と4桁コードを確認してください。');
      if (targetUser.id === currentUser.id) return alert('自分自身には申請できません。');

      const { error: reqErr } = await supabaseClient.from('friendships').insert({
        requester_id: currentUser.id,
        addressee_id: targetUser.id,
        status: 'pending'
      });

      if (reqErr) return alert('すでに申請済みか、フレンドです。');
      alert('フレンド申請を送信しました！');
      document.getElementById('friend-tag-input').value = '';
    }

    async function acceptFriend(friendshipId) {
      await supabaseClient.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
      await loadFriends();
    }

    // DMを開く
    async function openDm(friend) {
      currentView = 'home';
      activeServer = null;
      activeDmUser = friend;
      closeMobileMenu();

      document.getElementById('main-header-icon').textContent = '@';
      document.getElementById('main-header-title').textContent = friend.username;
      document.getElementById('message-input').placeholder = `@${friend.username} へメッセージを送信`;

      document.getElementById('friends-view').classList.add('hidden');
      document.getElementById('chat-view').classList.remove('hidden');

      await loadMessages();
      subscribeMessages();
    }

    function getDmRoomId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }

    // メッセージ読み込み & 送信
    async function loadMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '<p class="text-xs text-[#949ba4] text-center">読み込み中...</p>';

      let query = supabaseClient
        .from('messages')
        .select('*, profiles(username, avatar_color, avatar_url)')
        .order('created_at', { ascending: true })
        .limit(100);

      if (activeServer) {
        query = query.eq('server_id', activeServer.id);
      } else if (activeDmUser) {
        const dmId = getDmRoomId(currentUser.id, activeDmUser.id);
        query = query.eq('dm_id', dmId);
      }

      const { data, error } = await query;
      container.innerHTML = '';

      if (error) {
        container.innerHTML = `<p class="text-xs text-[#f23f42]">読み込みエラー: ${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-xs text-[#949ba4] text-center py-4">まだメッセージがありません。最初の挨拶を送ってみましょう！</p>';
        return;
      }

      data.forEach(msg => appendMessageToUI(msg));
      container.scrollTop = container.scrollHeight;
    }

    function appendMessageToUI(msg) {
      const container = document.getElementById('messages-container');
      if (container.querySelector('p.text-center')) container.innerHTML = '';

      const profile = msg.profiles || { username: '不明なユーザー', avatar_color: '#5865F2' };
      const time = new Date(msg.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

      const div = document.createElement('div');
      div.className = 'flex items-start space-x-3';
      div.innerHTML = `
        <div class="msg-av w-10 h-10 rounded-full flex items-center justify-center text-white font-bold shrink-0 overflow-hidden bg-cover bg-center"></div>
        <div class="min-w-0 flex-1">
          <div class="flex items-baseline space-x-2">
            <span class="font-bold text-white text-sm">${escapeHtml(profile.username)}</span>
            <span class="text-[11px] text-[#949ba4]">${time}</span>
          </div>
          <p class="text-[#dbdee1] text-sm break-words whitespace-pre-wrap mt-0.5">${escapeHtml(msg.content)}</p>
        </div>
      `;
      applyAvatarStyle(div.querySelector('.msg-av'), profile);
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';

      const roomId = activeServer ? activeServer.id : getDmRoomId(currentUser.id, activeDmUser.id);
      const payload = {
        room_id: roomId,
        sender_id: currentUser.id,
        content: content,
        server_id: activeServer ? activeServer.id : null,
        dm_id: activeDmUser ? roomId : null
      };

      const { data, error } = await supabaseClient
        .from('messages')
        .insert(payload)
        .select('*, profiles(username, avatar_color, avatar_url)')
        .single();

      if (error) {
        alert('送信エラー: ' + error.message);
        return;
      }

      if (data) {
        appendMessageToUI(data);
      }
    }

    function subscribeMessages() {
      if (messageChannel) supabaseClient.removeChannel(messageChannel);

      messageChannel = supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async (payload) => {
          const newMsg = payload.new;
          if (newMsg.sender_id === currentUser.id) return;

          const isForCurrentServer = activeServer && newMsg.server_id === activeServer.id;
          const isForCurrentDm = activeDmUser && newMsg.dm_id === getDmRoomId(currentUser.id, activeDmUser.id);

          if (isForCurrentServer || isForCurrentDm) {
            const { data: prof } = await supabaseClient
              .from('profiles')
              .select('username, avatar_color, avatar_url')
              .eq('id', newMsg.sender_id)
              .single();
            newMsg.profiles = prof;
            appendMessageToUI(newMsg);
          }
        })
        .subscribe();
    }

    // プロフィール編集モーダル処理
    function openProfileModal() {
      if (!myProfile) return;
      closeMobileMenu();
      tempAvatarUrl = myProfile.avatar_url || null;
      tempAvatarColor = myProfile.avatar_color || '#5865F2';

      document.getElementById('edit-username-input').value = myProfile.username;
      document.getElementById('edit-avatar-color').value = tempAvatarColor;
      updateEditPreview();
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    function updateEditPreview() {
      const preview = document.getElementById('edit-avatar-preview');
      const name = document.getElementById('edit-username-input').value || myProfile.username;
      if (tempAvatarUrl) {
        preview.style.backgroundImage = `url(${tempAvatarUrl})`;
        preview.style.backgroundColor = 'transparent';
        preview.textContent = '';
      } else {
        preview.style.backgroundImage = 'none';
        preview.style.backgroundColor = tempAvatarColor;
        preview.textContent = name.charAt(0).toUpperCase();
      }
    }

    function selectAvatarColor(color) {
      tempAvatarColor = color;
      tempAvatarUrl = null;
      updateEditPreview();
    }

    function clearAvatarImage() {
      tempAvatarUrl = null;
      document.getElementById('avatar-file-input').value = '';
      updateEditPreview();
    }

    // 画像を軽量圧縮してDataURL化
    function handleAvatarFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 128;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          tempAvatarUrl = canvas.toDataURL('image/jpeg', 0.8);
          updateEditPreview();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveProfile() {
      const newName = document.getElementById('edit-username-input').value.trim();
      if (!newName) return alert('ユーザー名を入力してください');

      const btn = document.getElementById('save-profile-btn');
      btn.disabled = true;
      btn.textContent = '保存中...';

      const { data, error } = await supabaseClient
        .from('profiles')
        .update({
          username: newName,
          avatar_color: tempAvatarColor,
          avatar_url: tempAvatarUrl,
          updated_at: new Date().toISOString()
        })
        .eq('id', currentUser.id)
        .select()
        .single();

      btn.disabled = false;
      btn.textContent = '変更を保存';

      if (error) {
        alert('保存エラー: ' + error.message);
        return;
      }

      myProfile = data;
      renderMyProfile();
      closeProfileModal();
      if (activeServer || activeDmUser) await loadMessages();
      if (currentView === 'home') await loadFriends();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
