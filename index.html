<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Raphael</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #313338; color: #f2f3f5; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; margin: 0; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #2b2d31; }
    ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function Avatar({ profile, size = "md", online = false }) {
      const sizeClasses = {
        sm: "w-8 h-8 text-xs",
        md: "w-10 h-10 text-sm",
        lg: "w-16 h-16 text-xl",
        xl: "w-20 h-20 text-2xl"
      };
      const name = profile?.username || "?";
      const color = profile?.avatar_color || "#5865F2";
      const avatarUrl = profile?.avatar_url;

      return (
        <div className={`relative inline-flex items-center justify-center rounded-full font-bold text-white shrink-0 select-none ${sizeClasses[size]}`} style={{ backgroundColor: avatarUrl ? 'transparent' : color }}>
          {avatarUrl ? (
            <img src={avatarUrl} alt={name} className="w-full h-full object-cover rounded-full" />
          ) : (
            <span>{name.slice(0, 1).toUpperCase()}</span>
          )}
          {online && (
            <span className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#2b2d31] rounded-full"></span>
          )}
        </div>
      );
    }

    function App() {
      const [supabaseUrl, setSupabaseUrl] = useState(localStorage.getItem('raphael_sb_url') || 'https://huzzkisjvjdyljkvmeze.supabase.co');
      const [supabaseKey, setSupabaseKey] = useState(localStorage.getItem('raphael_sb_key') || '');
      const [supabase, setSupabase] = useState(null);

      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [profilesMap, setProfilesMap] = useState({});
      const [onlineUsers, setOnlineUsers] = useState(new Set());

      // Auth states
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [usernameInput, setUsernameInput] = useState('');
      const [authLoading, setAuthLoading] = useState(false);

      // Navigation & UI states
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [activeView, setActiveView] = useState('friends'); // 'friends' | 'server' | 'dm'
      const [servers, setServers] = useState([]);
      const [activeServer, setActiveServer] = useState(null);
      const [activeDmUser, setActiveDmUser] = useState(null);

      // Messages
      const [messages, setMessages] = useState([]);
      const [newMessage, setNewMessage] = useState('');
      const messagesEndRef = useRef(null);

      // Friends
      const [friendships, setFriendships] = useState([]);
      const [friendInput, setFriendInput] = useState('');

      // Server Creation / Join Modals
      const [showServerModal, setShowServerModal] = useState(false);
      const [serverModalTab, setServerModalTab] = useState('create');
      const [newServerName, setNewServerName] = useState('');
      const [inviteCodeInput, setInviteCodeInput] = useState('');

      // Profile Edit Modal
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editName, setEditName] = useState('');
      const [editColor, setEditColor] = useState('#5865F2');
      const [editAvatarUrl, setEditAvatarUrl] = useState('');

      // Server Settings & Roles Modal
      const [showServerSettings, setShowServerSettings] = useState(false);
      const [settingsTab, setSettingsTab] = useState('roles'); // 'roles' | 'members' | 'invite'
      const [serverRoles, setServerRoles] = useState([]);
      const [memberRoles, setMemberRoles] = useState([]);
      const [serverMembers, setServerMembers] = useState([]);
      const [newRoleName, setNewRoleName] = useState('');
      const [newRoleColor, setNewRoleColor] = useState('#e91e63');
      const [permSend, setPermSend] = useState(true);
      const [permDelete, setPermDelete] = useState(false);
      const [permManageRoles, setPermManageRoles] = useState(false);
      const [permKick, setPermKick] = useState(false);

      // Initialize Supabase
      useEffect(() => {
        if (supabaseUrl && supabaseKey) {
          try {
            const client = window.supabase.createClient(supabaseUrl.trim(), supabaseKey.trim());
            setSupabase(client);
          } catch (e) {
            console.error(e);
          }
        }
      }, [supabaseUrl, supabaseKey]);

      const handleSaveConfig = (e) => {
        e.preventDefault();
        if (!supabaseUrl || !supabaseKey) return alert('URLとキーを入力してください');
        localStorage.setItem('raphael_sb_url', supabaseUrl.trim());
        localStorage.setItem('raphael_sb_key', supabaseKey.trim());
        const client = window.supabase.createClient(supabaseUrl.trim(), supabaseKey.trim());
        setSupabase(client);
      };

      // Session & Presence
      useEffect(() => {
        if (!supabase) return;
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
        });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
        });
        return () => subscription.unsubscribe();
      }, [supabase]);

      useEffect(() => {
        if (!supabase || !session?.user) return;
        const userId = session.user.id;

        const initUser = async () => {
          await fetchAllProfiles();
          let { data: prof } = await supabase.from('profiles').select('*').eq('id', userId).single();
          if (!prof) {
            const defaultName = session.user.user_metadata?.username || session.user.email.split('@')[0];
            const code = String(Math.floor(1000 + Math.random() * 9000));
            const { data: created } = await supabase.from('profiles').insert([{
              id: userId,
              username: defaultName,
              friend_code: code,
              avatar_color: '#5865F2'
            }]).select().single();
            prof = created;
          }
          setProfile(prof);
          setEditName(prof?.username || '');
          setEditColor(prof?.avatar_color || '#5865F2');
          setEditAvatarUrl(prof?.avatar_url || '');
          fetchServers();
          fetchFriendships();
        };

        initUser();

        // Presence channel
        const presenceChannel = supabase.channel('online-users', {
          config: { presence: { key: userId } }
        });
        presenceChannel
          .on('presence', { event: 'sync' }, () => {
            const state = presenceChannel.presenceState();
            setOnlineUsers(new Set(Object.keys(state)));
          })
          .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
              await presenceChannel.track({ online_at: new Date().toISOString() });
            }
          });

        return () => {
          supabase.removeChannel(presenceChannel);
        };
      }, [supabase, session]);

      const fetchAllProfiles = async () => {
        if (!supabase) return;
        const { data } = await supabase.from('profiles').select('*');
        if (data) {
          const map = {};
          data.forEach(p => { map[p.id] = p; });
          setProfilesMap(map);
          if (session?.user && map[session.user.id]) {
            setProfile(map[session.user.id]);
          }
        }
      };

      const fetchServers = async () => {
        if (!supabase || !session?.user) return;
        const { data: memberRows } = await supabase.from('server_members').select('server_id').eq('user_id', session.user.id);
        if (memberRows && memberRows.length > 0) {
          const ids = memberRows.map(r => r.server_id);
          const { data: srvData } = await supabase.from('servers').select('*').in('id', ids);
          setServers(srvData || []);
        } else {
          setServers([]);
        }
      };

      const fetchFriendships = async () => {
        if (!supabase || !session?.user) return;
        const uid = session.user.id;
        const { data } = await supabase.from('friendships').select('*').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`);
        setFriendships(data || []);
      };

      // Fetch server roles & members when activeServer changes
      useEffect(() => {
        if (!supabase || !activeServer) return;
        fetchServerDetails(activeServer.id);
      }, [supabase, activeServer]);

      const fetchServerDetails = async (serverId) => {
        const [{ data: roles }, { data: mRoles }, { data: members }] = await Promise.all([
          supabase.from('server_roles').select('*').eq('server_id', serverId).order('created_at', { ascending: true }),
          supabase.from('member_roles').select('*').eq('server_id', serverId),
          supabase.from('server_members').select('*').eq('server_id', serverId)
        ]);
        setServerRoles(roles || []);
        setMemberRoles(mRoles || []);
        setServerMembers(members || []);
      };

      // Messages listener
      useEffect(() => {
        if (!supabase || !session?.user) return;
        if (activeView === 'friends') {
          setMessages([]);
          return;
        }

        const getDmId = (u1, u2) => [u1, u2].sort().join('_');
        const currentRoomId = activeView === 'server' && activeServer
          ? `server_${activeServer.id}`
          : activeView === 'dm' && activeDmUser
          ? `dm_${getDmId(session.user.id, activeDmUser.id)}`
          : null;

        if (!currentRoomId) return;

        const loadMessages = async () => {
          let query = supabase.from('messages').select('*').order('created_at', { ascending: true });
          if (activeView === 'server' && activeServer) {
            query = query.eq('server_id', activeServer.id);
          } else if (activeView === 'dm' && activeDmUser) {
            query = query.eq('dm_id', getDmId(session.user.id, activeDmUser.id));
          }
          const { data } = await query;
          setMessages(data || []);
        };

        loadMessages();

        const msgChannel = supabase.channel(`room-${currentRoomId}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (payload) => {
            if (payload.eventType === 'INSERT') {
              const m = payload.new;
              const isMatch = (activeView === 'server' && m.server_id === activeServer?.id) ||
                              (activeView === 'dm' && m.dm_id === getDmId(session.user.id, activeDmUser?.id));
              if (isMatch) {
                setMessages(prev => prev.some(x => x.id === m.id) ? prev : [...prev, m]);
                fetchAllProfiles();
              }
            } else if (payload.eventType === 'DELETE') {
              setMessages(prev => prev.filter(x => x.id !== payload.old.id));
            }
          })
          .subscribe();

        return () => {
          supabase.removeChannel(msgChannel);
        };
      }, [supabase, session, activeView, activeServer, activeDmUser]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Auth handlers
      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        try {
          if (isSignUp) {
            const { error } = await supabase.auth.signUp({
              email,
              password,
              options: { data: { username: usernameInput || email.split('@')[0] } }
            });
            if (error) throw error;
          } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
          }
        } catch (err) {
          alert(err.message);
        } finally {
          setAuthLoading(false);
        }
      };

      // Permissions helper for current user in activeServer
      const getUserPermissions = (userId) => {
        if (!activeServer) return { canSend: true, canDelete: false, canManageRoles: false, canKick: false, topRole: null };
        const isOwner = activeServer.owner_id === userId;
        const userRoleIds = memberRoles.filter(mr => mr.user_id === userId).map(mr => mr.role_id);
        const userRoles = serverRoles.filter(r => userRoleIds.includes(r.id));

        if (isOwner) {
          return {
            canSend: true,
            canDelete: true,
            canManageRoles: true,
            canKick: true,
            topRole: userRoles[0] || { name: 'サーバー主', color: '#f1c40f' }
          };
        }

        const hasRoles = userRoles.length > 0;
        return {
          canSend: hasRoles ? userRoles.some(r => r.can_send_messages) : true,
          canDelete: userRoles.some(r => r.can_delete_messages),
          canManageRoles: userRoles.some(r => r.can_manage_roles),
          canKick: userRoles.some(r => r.can_kick_members),
          topRole: userRoles[0] || null
        };
      };

      const myPerms = session?.user ? getUserPermissions(session.user.id) : { canSend: true, canDelete: false, canManageRoles: false, canKick: false };

      // Send Message
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!newMessage.trim() || !session?.user) return;
        if (activeView === 'server' && !myPerms.canSend) {
          return alert('このサーバーではメッセージ送信権限がありません。');
        }

        const getDmId = (u1, u2) => [u1, u2].sort().join('_');
        const payload = {
          sender_id: session.user.id,
          content: newMessage.trim(),
          room_id: activeView === 'server' ? `server_${activeServer.id}` : `dm_${getDmId(session.user.id, activeDmUser.id)}`,
          server_id: activeView === 'server' ? activeServer.id : null,
          dm_id: activeView === 'dm' ? getDmId(session.user.id, activeDmUser.id) : null
        };

        setNewMessage('');
        const { error } = await supabase.from('messages').insert([payload]);
        if (error) {
          alert('送信エラー: ' + error.message);
        }
      };

      const handleDeleteMessage = async (msgId) => {
        if (!confirm('このメッセージを削除しますか？')) return;
        const { error } = await supabase.from('messages').delete().eq('id', msgId);
        if (error) alert('削除エラー: ' + error.message);
        else setMessages(prev => prev.filter(m => m.id !== msgId));
      };

      // Server Create & Join
      const handleCreateServer = async (e) => {
        e.preventDefault();
        if (!newServerName.trim()) return;
        const inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        const { data: srv, error } = await supabase.from('servers').insert([{
          name: newServerName.trim(),
          invite_code: inviteCode,
          owner_id: session.user.id
        }]).select().single();

        if (error) return alert('サーバー作成エラー: ' + error.message);

        await supabase.from('server_members').insert([{
          server_id: srv.id,
          user_id: session.user.id
        }]);

        setNewServerName('');
        setShowServerModal(false);
        await fetchServers();
        setActiveServer(srv);
        setActiveView('server');
      };

      const handleJoinServer = async (e) => {
        e.preventDefault();
        if (!inviteCodeInput.trim()) return;
        const { data: srv, error } = await supabase.from('servers').select('*').eq('invite_code', inviteCodeInput.trim().toUpperCase()).single();
        if (error || !srv) return alert('招待コードが見つかりません');

        const { error: joinErr } = await supabase.from('server_members').insert([{
          server_id: srv.id,
          user_id: session.user.id
        }]);
        if (joinErr && !joinErr.message.includes('duplicate')) return alert('参加エラー: ' + joinErr.message);

        setInviteCodeInput('');
        setShowServerModal(false);
        await fetchServers();
        setActiveServer(srv);
        setActiveView('server');
      };

      // Role Management
      const handleCreateRole = async (e) => {
        e.preventDefault();
        if (!newRoleName.trim() || !activeServer) return;
        const { error } = await supabase.from('server_roles').insert([{
          server_id: activeServer.id,
          name: newRoleName.trim(),
          color: newRoleColor,
          can_send_messages: permSend,
          can_delete_messages: permDelete,
          can_manage_roles: permManageRoles,
          can_kick_members: permKick
        }]);
        if (error) return alert('ロール作成エラー: ' + error.message);
        setNewRoleName('');
        fetchServerDetails(activeServer.id);
      };

      const handleDeleteRole = async (roleId) => {
        if (!confirm('このロールを削除しますか？')) return;
        await supabase.from('server_roles').delete().eq('id', roleId);
        fetchServerDetails(activeServer.id);
      };

      const handleToggleMemberRole = async (targetUserId, roleId) => {
        const exists = memberRoles.some(mr => mr.user_id === targetUserId && mr.role_id === roleId);
        if (exists) {
          await supabase.from('member_roles').delete()
            .eq('server_id', activeServer.id)
            .eq('user_id', targetUserId)
            .eq('role_id', roleId);
        } else {
          await supabase.from('member_roles').insert([{
            server_id: activeServer.id,
            user_id: targetUserId,
            role_id: roleId
          }]);
        }
        fetchServerDetails(activeServer.id);
      };

      const handleKickMember = async (targetUserId) => {
        if (!confirm('このメンバーをサーバーから追放しますか？')) return;
        await supabase.from('server_members').delete()
          .eq('server_id', activeServer.id)
          .eq('user_id', targetUserId);
        fetchServerDetails(activeServer.id);
      };

      // Friends
      const handleSendFriendRequest = async (e) => {
        e.preventDefault();
        const parts = friendInput.trim().split('#');
        if (parts.length !== 2) return alert('「ユーザー名#4桁コード」の形式で入力してください');
        const [targetName, targetCode] = parts;

        const { data: targetUser } = await supabase.from('profiles')
          .select('*')
          .eq('username', targetName)
          .eq('friend_code', targetCode)
          .single();

        if (!targetUser) return alert('ユーザーが見つかりません');
        if (targetUser.id === session.user.id) return alert('自分自身には申請できません');

        const { error } = await supabase.from('friendships').insert([{
          requester_id: session.user.id,
          addressee_id: targetUser.id,
          status: 'pending'
        }]);
        if (error) return alert('すでに申請済みかエラーが発生しました');
        alert('フレンド申請を送信しました！');
        setFriendInput('');
        fetchFriendships();
      };

      const handleAcceptFriend = async (friendshipId) => {
        await supabase.from('friendships').update({ status: 'accepted' }).eq('id', friendshipId);
        fetchFriendships();
      };

      // Profile Update & Image Compression
      const handleImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            setEditAvatarUrl(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!editName.trim()) return;
        const { error } = await supabase.from('profiles').update({
          username: editName.trim(),
          avatar_color: editColor,
          avatar_url: editAvatarUrl || null
        }).eq('id', session.user.id);

        if (error) return alert('保存エラー: ' + error.message);
        await fetchAllProfiles();
        setShowProfileModal(false);
      };

      // 1. Setup Screen
      if (!supabase || !supabaseKey) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#1e1f22] p-4">
            <form onSubmit={handleSaveConfig} className="bg-[#2b2d31] p-6 rounded-xl shadow-2xl w-full max-w-md space-y-4">
              <div className="text-center">
                <div className="w-12 h-12 bg-[#5865F2] rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl mb-3">R</div>
                <h1 className="text-xl font-bold">Raphael 初期セットアップ</h1>
                <p className="text-xs text-gray-400 mt-1">Supabaseの接続情報を入力してください</p>
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1">PROJECT URL</label>
                <input type="text" value={supabaseUrl} onChange={e => setSupabaseUrl(e.target.value)} className="w-full bg-[#1e1f22] text-white p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-[#5865F2]" placeholder="https://xxxx.supabase.co" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1">ANON PUBLIC KEY</label>
                <input type="text" value={supabaseKey} onChange={e => setSupabaseKey(e.target.value)} className="w-full bg-[#1e1f22] text-white p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-[#5865F2]" placeholder="sb_publishable_... または eyJhb..." required />
              </div>
              <button type="submit" className="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold py-2.5 rounded transition">保存して次へ</button>
            </form>
          </div>
        );
      }

      // 2. Login / Sign Up Screen
      if (!session) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#1e1f22] p-4">
            <form onSubmit={handleAuth} className="bg-[#2b2d31] p-6 rounded-xl shadow-2xl w-full max-w-md space-y-4">
              <div className="text-center">
                <div className="w-12 h-12 bg-[#5865F2] rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-2xl mb-3">R</div>
                <h1 className="text-xl font-bold">{isSignUp ? 'Raphael アカウント作成' : 'Raphael にログイン'}</h1>
              </div>
              {isSignUp && (
                <div>
                  <label className="block text-xs font-bold text-gray-300 mb-1">ユーザー名</label>
                  <input type="text" value={usernameInput} onChange={e => setUsernameInput(e.target.value)} className="w-full bg-[#1e1f22] text-white p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-[#5865F2]" placeholder="表示名を入力" required />
                </div>
              )}
              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1">メールアドレス</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full bg-[#1e1f22] text-white p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-[#5865F2]" placeholder="mail@example.com" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-gray-300 mb-1">パスワード</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-[#1e1f22] text-white p-2.5 rounded text-sm outline-none focus:ring-2 focus:ring-[#5865F2]" placeholder="6文字以上" required />
              </div>
              <button type="submit" disabled={authLoading} className="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white font-bold py-2.5 rounded transition">
                {authLoading ? '処理中...' : isSignUp ? 'アカウント登録' : 'ログイン'}
              </button>
              <div className="text-center">
                <button type="button" onClick={() => setIsSignUp(!isSignUp)} className="text-xs text-[#00a8fc] hover:underline">

                              <input type="checkbox" checked={permSend} onChange={e => setPermSend(e.target.checked)} className="w-4 h-4 accent-[#5865F2]" />
                            </label>
                            <label className="flex items-center justify-between text-xs bg-[#2b2d31] p-2 rounded cursor-pointer">
                              <span>🗑️ 他人のメッセージ削除</span>
                              <input type="checkbox" checked={permDelete} onChange={e => setPermDelete(e.target.checked)} className="w-4 h-4 accent-[#5865F2]" />
                            </label>
                            <label className="flex items-center justify-between text-xs bg-[#2b2d31] p-2 rounded cursor-pointer">
                              <span>🛡️ ロールの作成・付与</span>
                              <input type="checkbox" checked={permManageRoles} onChange={e => setPermManageRoles(e.target.checked)} className="w-4 h-4 accent-[#5865F2]" />
                            </label>
                            <label className="flex items-center justify-between text-xs bg-[#2b2d31] p-2 rounded cursor-pointer">
                              <span>👢 メンバーの追放（キック）</span>
                              <input type="checkbox" checked={permKick} onChange={e => setPermKick(e.target.checked)} className="w-4 h-4 accent-[#5865F2]" />
                            </label>
                          </div>

                          <button type="submit" className="w-full bg-[#5865F2] hover:bg-[#4752c4] py-2 rounded text-xs font-bold">
                            ＋ ロールを作成
                          </button>
                        </form>
                      )}

                      {/* Existing Roles List */}
                      <div className="space-y-2">
                        <h3 className="text-xs font-bold text-gray-400 uppercase">作成済みのロール ({serverRoles.length})</h3>
                        {serverRoles.length === 0 ? (
                          <p className="text-xs text-gray-400">まだロールがありません。</p>
                        ) : (
                          serverRoles.map(role => (
                            <div key={role.id} className="bg-[#1e1f22] p-3 rounded-lg flex items-center justify-between">
                              <div>
                                <div className="flex items-center gap-2">
                                  <span className="w-3 h-3 rounded-full" style={{ backgroundColor: role.color }}></span>
                                  <span className="font-bold text-sm" style={{ color: role.color }}>{role.name}</span>
                                </div>
                                <div className="flex flex-wrap gap-1 mt-1.5">
                                  {role.can_send_messages && <span className="text-[10px] bg-[#2b2d31] px-1.5 py-0.5 rounded text-gray-300">送信可</span>}
                                  {!role.can_send_messages && <span className="text-[10px] bg-red-900/40 px-1.5 py-0.5 rounded text-red-300">送信不可</span>}
                                  {role.can_delete_messages && <span className="text-[10px] bg-[#2b2d31] px-1.5 py-0.5 rounded text-yellow-300">メッセージ削除</span>}
                                  {role.can_manage_roles && <span className="text-[10px] bg-[#2b2d31] px-1.5 py-0.5 rounded text-blue-300">ロール管理</span>}
                                  {role.can_kick_members && <span className="text-[10px] bg-[#2b2d31] px-1.5 py-0.5 rounded text-red-300">追放権限</span>}
                                </div>
                              </div>
                              {(activeServer.owner_id === session.user.id || myPerms.canManageRoles) && (
                                <button onClick={() => handleDeleteRole(role.id)} className="text-xs text-red-400 hover:text-red-300 px-2 py-1">
                                  削除
                                </button>
                              )}
                            </div>
                          ))
                        )}
                      </div>
                    </>
                  ) : (
                    /* Members & Role Assignment Tab */
                    <div className="space-y-3">
                      <p className="text-xs text-gray-400">メンバーをタップしてロールの付与・解除ができます。</p>
                      {serverMembers.map(m => {
                        const p = profilesMap[m.user_id];
                        if (!p) return null;
                        const assignedIds = memberRoles.filter(mr => mr.user_id === m.user_id).map(mr => mr.role_id);
                        const isServerOwner = activeServer.owner_id === m.user_id;

                        return (
                          <div key={m.user_id} className="bg-[#1e1f22] p-3 rounded-lg space-y-2.5">
                            <div className="flex items-center justify-between">
                              <div className="flex items-center gap-2.5">
                                <Avatar profile={p} size="sm" online={onlineUsers.has(p.id)} />
                                <div>
                                  <div className="font-bold text-sm flex items-center gap-1.5">
                                    <span>{p.username}</span>
                                    {isServerOwner && <span className="text-[10px] bg-yellow-600/30 text-yellow-400 px-1.5 py-0.5 rounded">👑 作成者</span>}
                                  </div>
                                  <div className="text-[11px] text-gray-400">#{p.friend_code}</div>
                                </div>
                              </div>

                              {!isServerOwner && (activeServer.owner_id === session.user.id || myPerms.canKick) && m.user_id !== session.user.id && (
                                <button
                                  onClick={() => handleKickMember(m.user_id)}
                                  className="text-xs bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-2.5 py-1 rounded font-bold transition"
                                >
                                  追放
                                </button>
                              )}
                            </div>

                            {/* Role toggles */}
                            {(activeServer.owner_id === session.user.id || myPerms.canManageRoles) && serverRoles.length > 0 && (
                              <div className="flex flex-wrap gap-1.5 pt-1 border-t border-[#2b2d31]">
                                {serverRoles.map(role => {
                                  const active = assignedIds.includes(role.id);
                                  return (
                                    <button
                                      key={role.id}
                                      onClick={() => handleToggleMemberRole(m.user_id, role.id)}
                                      className={`text-xs px-2 py-1 rounded-full font-bold transition flex items-center gap-1 ${active ? 'opacity-100 ring-1 ring-white' : 'opacity-40 hover:opacity-80'}`}
                                      style={{ backgroundColor: `${role.color}30`, color: role.color }}
                                    >
                                      <span>{active ? '✓' : '+'}</span>
                                      <span>{role.name}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
