<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    position: fixed;

<!-- ▼▼▼ 表向きの学習サイト ▼▼▼ -->
<div id="study-cover">

    <h1 class="m-0 text-base font-bold">📚 Web基礎学習ドリル（英単語・計算演習）</h1>
    <span class="text-xs bg-white/20 px-2 py-0.5 rounded">学習モード：標準</span>

<script>
// ==========================================
// 1. 表向き学習サイト＆裏コード（DZR）制御
// ==========================================
const SECRET_COMMAND = "DZR";
const questions = [
  { cat: "英語・基礎単語", sub: "日本語の意味を入力してください", q: "environment", a: ["環境"] },
  { cat: "数学・計算", sub: "x の値を求めなさい", q: "3x + 7 = 22", a: ["5", "x=5"] },
  { cat: "英語・基礎単語", sub: "日本語の意味を入力してください", q: "opportunity", a: ["機会", "チャンス"] },
  { cat: "理科・基礎", sub: "元素記号を答えなさい", q: "酸素", a: ["O", "o", "O2"] }
];
let currentQ = 0;

function submitAnswer() {
  const val = document.getElementById('user-answer').value.trim();
  const feedback = document.getElementById('feedback-msg');
  if (questions[currentQ].a.includes(val)) {
    feedback.style.color = "#2e7d32";
    feedback.textContent = "⭕ 正解です！よくできました。";
  } else {
    feedback.style.color = "#d32f2f";
    feedback.textContent = "❌ 不正解です。もう一度考えてみましょう。";
  }
}

document.getElementById('user-answer').addEventListener('keypress', e => {
  if (e.key === 'Enter') submitAnswer();
});

function nextQuestion() {
  currentQ = (currentQ + 1) % questions.length;
  document.getElementById('q-category').textContent = questions[currentQ].cat;
  document.getElementById('q-sub').textContent = questions[currentQ].sub;
  document.getElementById('q-main').textContent = questions[currentQ].q;
  document.getElementById('user-answer').value = "";
  document.getElementById('feedback-msg').textContent = "";
}

function runCommand() {
  const cmdInput = document.getElementById('secret-cmd-input');
  if (cmdInput.value.trim().toUpperCase() === SECRET_COMMAND) {
    document.getElementById('study-cover').style.display = 'none';
    cmdInput.value = "";
    document.title = "Raphael";
  } else {
    alert("指定された教材コマンドは見つかりませんでした。");
    cmdInput.value = "";
  }
}

document.getElementById('secret-cmd-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') runCommand();
});

function lockSite() {
  document.getElementById('study-cover').style.display = 'block';
  document.title = "Web基礎学習ドリル｜英単語・計算演習";
}

let lastEscTime = 0;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (Date.now() - lastEscTime < 500) lockSite();
    lastEscTime = Date.now();
  }
});

// ==========================================
// 2. Raphael 本体プログラム（Supabase連携）
// ==========================================
const SUPABASE_URL = "https://huzzkisjvjdyljkvmeze.supabase.co";
const SUPABASE_KEY = "sb_publishable_RoYU3XG8ohLuRW7baisURA_VDsCtD3l";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null, myProfile = null, isSignUp = false;
let currentRoom = { type: 'home', id: null, name: 'フレンド', ownerId: null, inviteCode: null };
let onlineUsers = new Set(), profilesMap = {}, serverRoles = [], memberRoles = [];
let uploadedAvatarBase64 = null;
let callChannel = null, localStream = null, screenStream = null, peers = {}, inCall = false, isMuted = false;

window.onload = async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) initApp(session.user);
};

function toggleAuthMode() {
  isSignUp = !isSignUp;
  document.getElementById('auth-title').textContent = isSignUp ? 'Raphael アカウント作成' : 'Raphael にログイン';
  document.getElementById('auth-submit-btn').textContent = isSignUp ? '登録する' : 'ログイン';
  document.getElementById('auth-toggle-btn').textContent = isSignUp ? 'すでにアカウントをお持ちの方はこちら' : 'アカウント登録はこちら';
  document.getElementById('username-field').classList.toggle('hidden', !isSignUp);
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const username = document.getElementById('auth-username').value.trim() || email.split('@')[0];
  const errEl = document.getElementById('auth-error');
  errEl.classList.add('hidden');
  try {
    if (isSignUp) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username } } });
      if (error) throw error;
      if (data.user) {
        const code = String(Math.floor(1000 + Math.random() * 9000));
        await sb.from('profiles').upsert({ id: data.user.id, username, friend_code: code });
        initApp(data.user);
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      initApp(data.user);
    }
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
  }
}

async function logout() {
  leaveCall();
  await sb.auth.signOut();
  location.reload();
}

async function initApp(user) {
  currentUser = user;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  await loadMyProfile();
  setupPresence();
  setupRealtime();
  await loadServers();
  selectHome();
}

async function loadMyProfile() {
  let { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (!data) {
    const code = String(Math.floor(1000 + Math.random() * 9000));
    const uname = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
    const res = await sb.from('profiles').insert({ id: currentUser.id, username: uname, friend_code: code }).select().single();
    data = res.data;
  }
  myProfile = data;
  profilesMap[myProfile.id] = myProfile;
  renderAvatar(document.getElementById('my-avatar'), myProfile);
  document.getElementById('my-username').textContent = myProfile.username;
  document.getElementById('my-code').textContent = '#' + myProfile.friend_code;
  document.getElementById('my-full-id').textContent = `${myProfile.username}#${myProfile.friend_code}`;
}

function renderAvatar(el, profile) {
  if (!profile) return;
  if (profile.avatar_url) {
    el.innerHTML = `<img src="${profile.avatar_url}" class="w-full h-full object-cover">`;
  } else {
    el.innerHTML = '';
    el.style.backgroundColor = profile.avatar_color || '#5865f2';
    el.textContent = (profile.username || '?')[0].toUpperCase();
  }
}

function setupPresence() {
  const room = sb.channel('online-users', { config: { presence: { key: currentUser.id } } });
  room.on('presence', { event: 'sync' }, () => {
    onlineUsers = new Set(Object.keys(room.presenceState()));
    if (currentRoom.type === 'home') loadFriends();
  }).subscribe(async (status) => {
    if (status === 'SUBSCRIBED') await room.track({ user_id: currentUser.id });
  });
}

function setupRealtime() {
  sb.channel('db-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
      const m = payload.new;
      if ((currentRoom.type === 'server' && m.server_id === currentRoom.id) ||
          (currentRoom.type === 'dm' && m.dm_id === currentRoom.id)) {
        appendMessage(m);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => {
      if (currentRoom.type === 'home') loadFriends();
    })
    .subscribe();
}

function toggleDrawer(open) {
  const drawer = document.getElementById('left-drawer');
  const overlay = document.getElementById('drawer-overlay');
  drawer.classList.toggle('-translate-x-full', !open);
  overlay.classList.toggle('hidden', !open);
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ホーム（フレンド・DM一覧）
async function selectHome() {
  currentRoom = { type: 'home', id: null, name: 'フレンド', ownerId: null, inviteCode: null };
  document.getElementById('sidebar-title').textContent = 'ダイレクトメッセージ';
  document.getElementById('server-settings-btn').classList.add('hidden');
  document.getElementById('room-icon').textContent = '👥';
  document.getElementById('room-title').textContent = 'フレンド';
  document.getElementById('call-btn').classList.add('hidden');
  document.getElementById('invite-btn').classList.add('hidden');
  document.getElementById('home-view').classList.remove('hidden');
  document.getElementById('chat-view').classList.add('hidden');
  toggleDrawer(false);
  await loadFriends();
}

async function loadFriends() {
  const { data: ships } = await sb.from('friendships').select('*').or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);
  const pendingEl = document.getElementById('pending-requests');
  const friendsEl = document.getElementById('friends-list');
  const sidebarEl = document.getElementById('sidebar-content');
  pendingEl.innerHTML = '';
  friendsEl.innerHTML = '';
  sidebarEl.innerHTML = `<div onclick="selectHome()" class="px-2.5 py-2 rounded bg-[#35373c] text-white text-sm font-bold cursor-pointer flex items-center gap-2"><span>👥</span> フレンド</div>`;

  if (!ships || ships.length === 0) {
    friendsEl.innerHTML = '<p class="text-xs text-[#949ba4]">フレンドがいません。</p>';
    return;
  }

  const otherIds = ships.map(s => s.user_id === currentUser.id ? s.friend_id : s.user_id);
  const { data: profs } = await sb.from('profiles').select('*').in('id', otherIds);
  (profs || []).forEach(p => profilesMap[p.id] = p);

  for (const s of ships) {
    const otherId = s.user_id === currentUser.id ? s.friend_id : s.user_id;
    const prof = profilesMap[otherId] || { username: '不明', friend_code: '0000' };
    const isOnline = onlineUsers.has(otherId);

    if (s.status === 'pending') {
      if (s.friend_id === currentUser.id) {
        pendingEl.innerHTML += `
          <div class="flex items-center justify-between bg-[#2b2d31] p-2.5 rounded">
            <span class="text-sm text-white font-bold">${prof.username}#${prof.friend_code}</span>
            <div class="flex gap-1.5">
              <button onclick="acceptFriend('${s.id}')" class="px-2.5 py-1 rounded bg-[#23a55a] text-white text-xs font-bold">承認</button>
              <button onclick="removeFriend('${s.id}')" class="px-2.5 py-1 rounded bg-[#da373c] text-white text-xs font-bold">拒否</button>
            </div>
          </div>`;
      } else {
        pendingEl.innerHTML += `<div class="text-xs text-[#949ba4] bg-[#2b2d31] p-2 rounded">送信済み: ${prof.username}#${prof.friend_code}</div>`;
      }
    } else if (s.status === 'accepted') {
      const dmId = [currentUser.id, otherId].sort().join('_');
      friendsEl.innerHTML += `
        <div onclick="openDM('${dmId}', '${prof.username}')" class="flex items-center justify-between p-2.5 rounded hover:bg-[#35373c] cursor-pointer">
          <div class="flex items-center gap-2.5">
            <div class="relative">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs overflow-hidden" style="background:${prof.avatar_color || '#5865f2'}">
                ${prof.avatar_url ? `<img src="${prof.avatar_url}" class="w-full h-full object-cover">` : prof.username[0].toUpperCase()}
              </div>
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'} ring-2 ring-[#313338]"></span>
            </div>
            <div>
              <div class="text-sm font-bold text-white">${prof.username} <span class="text-xs text-[#949ba4] font-normal">#${prof.friend_code}</span></div>
              <div class="text-[11px] text-[#949ba4]">${isOnline ? 'オンライン' : 'オフライン'}</div>
            </div>
          </div>
          <span class="text-xs text-[#b5bac1] bg-[#2b2d31] px-2.5 py-1 rounded">チャット</span>
        </div>`;

      sidebarEl.innerHTML += `
        <div onclick="openDM('${dmId}', '${prof.username}')" class="px-2.5 py-2 rounded hover:bg-[#35373c] text-[#949ba4] hover:text-white text-sm cursor-pointer flex items-center gap-2">
          <span class="w-2 h-2 rounded-full ${isOnline ? 'bg-[#23a55a]' : 'bg-[#80848e]'}"></span>
          <span class="truncate">${prof.username}</span>
        </div>`;
    }
  }
}

async function sendFriendRequest() {
  const input = document.getElementById('friend-tag-input').value.trim();
  const [uname, code] = input.split('#');
  if (!uname || !code) return alert('「ユーザー名#4桁コード」の形式で入力してください');
  const { data: target } = await sb.from('profiles').select('*').eq('username', uname).eq('friend_code', code).single();
  if (!target) return alert('ユーザーが見つかりません');
  if (target.id === currentUser.id) return alert('自分自身には申請できません');
  await sb.from('friendships').insert({ user_id: currentUser.id, friend_id: target.id, status: 'pending' });
  document.getElementById('friend-tag-input').value = '';
  alert('フレンド申請を送信しました！');
  loadFriends();
}

async function acceptFriend(id) {
  await sb.from('friendships').update({ status: 'accepted' }).eq('id', id);
  loadFriends();
}

async function removeFriend(id) {
  await sb.from('friendships').delete().eq('id', id);
  loadFriends();
}

async function openDM(dmId, name) {
  currentRoom = { type: 'dm', id: dmId, name, ownerId: null, inviteCode: null };
  document.getElementById('room-icon').textContent = '@';
  document.getElementById('room-title').textContent = name;
  document.getElementById('call-btn').classList.remove('hidden');
  document.getElementById('invite-btn').classList.add('hidden');
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('chat-view').classList.remove('hidden');
  toggleDrawer(false);
  await loadMessages();
}

// サーバー機能
async function loadServers() {
  const { data: mems } = await sb.from('server_members').select('server_id, servers(*)').eq('user_id', currentUser.id);
  const listEl = document.getElementById('server-list');
  listEl.innerHTML = '';
  (mems || []).forEach(m => {
    const s = m.servers;
    if (!s) return;
    listEl.innerHTML += `
      <button onclick="selectServer('${s.id}', '${s.name}', '${s.owner_id}', '${s.invite_code}')" class="w-12 h-12 rounded-3xl hover:rounded-2xl bg-[#313338] hover:bg-[#5865f2] text-white font-bold text-sm flex items-center justify-center transition shrink-0" title="${s.name}">
        ${s.name.slice(0, 2)}
      </button>`;
  });
}

async function createServer() {
  const name = document.getElementById('new-server-name').value.trim();
  if (!name) return;
  const inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  const { data: srv, error } = await sb.from('servers').insert({ name, owner_id: currentUser.id, invite_code: inviteCode }).select().single();
  if (error) return alert(error.message);
  await sb.from('server_members').insert({ server_id: srv.id, user_id: currentUser.id });
  document.getElementById('new-server-name').value = '';
  closeModal('server-modal');
  await loadServers();
  selectServer(srv.id, srv.name, srv.owner_id, srv.invite_code);
}

async function joinServerByInvite() {
  const code = document.getElementById('invite-code-input').value.trim().toUpperCase();
  if (!code) return;
  const { data: srv } = await sb.from('servers').select('*').eq('invite_code', code).single();
  if (!srv) return alert('招待コードが無効です');
  await sb.from('server_members').upsert({ server_id: srv.id, user_id: currentUser.id });
  document.getElementById('invite-code-input').value = '';
  closeModal('server-modal');
  await loadServers();
  selectServer(srv.id, srv.name, srv.owner_id, srv.invite_code);
}

async function selectServer(id, name, ownerId, inviteCode) {
  currentRoom = { type: 'server', id, name, ownerId, inviteCode };
  document.getElementById('sidebar-title').textContent = name;
  document.getElementById('server-settings-btn').classList.toggle('hidden', ownerId !== currentUser.id);
  document.getElementById('room-icon').textContent = '#';
  document.getElementById('room-title').textContent = '一般';
  document.getElementById('call-btn').classList.remove('hidden');
  document.getElementById('invite-btn').classList.remove('hidden');
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('chat-view').classList.remove('hidden');
  document.getElementById('sidebar-content').innerHTML = `
    <div class="text-[11px] font-bold text-[#949ba4] px-2 pt-2">テキストチャンネル</div>
    <div class="px-2.5 py-1.5 rounded bg-[#35373c] text-white text-sm font-bold flex items-center gap-1.5"># 一般</div>
    <div class="text-[11px] font-bold text-[#949ba4] px-2 pt-3">ボイスチャンネル</div>
    <div onclick="joinCall()" class="px-2.5 py-1.5 rounded hover:bg-[#35373c] text-[#949ba4] hover:text-white text-sm cursor-pointer flex items-center gap-1.5">🔊 ボイス＆画面共有</div>`;
  toggleDrawer(false);
  await loadMessages();
}

function copyInvite() {
  if (!currentRoom.inviteCode) return;
  navigator.clipboard?.writeText(currentRoom.inviteCode);
  alert(`招待コード「${currentRoom.inviteCode}」をコピーしました！`);
}

// チャット送受信
async function loadMessages() {
  const listEl = document.getElementById('messages-list');
  listEl.innerHTML = '';
  let query = sb.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
  if (currentRoom.type === 'server') query = query.eq('server_id', currentRoom.id);
  else query = query.eq('dm_id', currentRoom.id);

  const { data: msgs } = await query;
  const userIds = [...new Set((msgs || []).map(m => m.user_id))];
  if (userIds.length > 0) {
    const { data: profs } = await sb.from('profiles').select('*').in('id', userIds);
    (profs || []).forEach(p => profilesMap[p.id] = p);
  }
  (msgs || []).forEach(m => appendMessage(m));
}

function appendMessage(m) {
  const listEl = document.getElementById('messages-list');
  const prof = profilesMap[m.user_id] || { username: 'ユーザー', avatar_color: '#5865f2' };
  const time = new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'flex items-start gap-3 hover:bg-[#2e3035] p-1.5 rounded';
  div.innerHTML = `
    <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0 overflow-hidden" style="background:${prof.avatar_color || '#5865f2'}">
      ${prof.avatar_url ? `<img src="${prof.avatar_url}" class="w-full h-full object-cover">` : (prof.username || '?')[0].toUpperCase()}
    </div>
    <div class="min-w-0 flex-1">
      <div class="flex items-baseline gap-2">
        <span class="font-bold text-white text-sm">${prof.username}</span>
        <span class="text-[11px] text-[#949ba4]">${time}</span>
      </div>
      <div class="text-sm text-[#dbdee1] break-words mt-0.5">${escapeHtml(m.content)}</div>
    </div>`;
  listEl.appendChild(div);
  listEl.scrollTop = listEl.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  const payload = { user_id: currentUser.id, content };
  if (currentRoom.type === 'server') payload.server_id = currentRoom.id;
  else payload.dm_id = currentRoom.id;
  await sb.from('messages').insert(payload);
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// プロフィール編集
function openProfileModal() {
  document.getElementById('edit-username').value = myProfile.username;
  document.getElementById('edit-color').value = myProfile.avatar_color || '#5865f2';
  renderAvatar(document.getElementById('edit-avatar-preview'), myProfile);
  openModal('profile-modal');
}

function handleAvatarUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    uploadedAvatarBase64 = ev.target.result;
    document.getElementById('edit-avatar-preview').innerHTML = `<img src="${uploadedAvatarBase64}" class="w-full h-full object-cover">`;
  };
  reader.readAsDataURL(file);
}

async function saveProfile() {
  const username = document.getElementById('edit-username').value.trim() || myProfile.username;
  const avatar_color = document.getElementById('edit-color').value;
  const updates = { username, avatar_color };
  if (uploadedAvatarBase64) updates.avatar_url = uploadedAvatarBase64;
  await sb.from('profiles').update(updates).eq('id', currentUser.id);
  uploadedAvatarBase64 = null;
  await loadMyProfile();
  closeModal('profile-modal');
}

// サーバー設定（ロール）
async function openServerSettings() {
  openModal('settings-modal');
  await loadRolesAndMembers();
}

async function loadRolesAndMembers() {
  const { data: roles } = await sb.from('server_roles').select('*').eq('server_id', currentRoom.id);
  const rolesEl = document.getElementById('roles-list');
  rolesEl.innerHTML = (roles || []).map(r => `<div class="p-2 bg-[#2b2d31] rounded flex items-center gap-2"><span class="w-3 h-3 rounded-full" style="background:${r.color}"></span><span class="text-white font-bold">${r.name}</span></div>`).join('') || '<p class="text-[#949ba4]">ロールがありません</p>';
}

async function createRole() {
  const name = document.getElementById('role-name-input').value.trim();
  if (!name) return;
  const color = document.getElementById('role-color-input').value;
  await sb.from('server_roles').insert({ server_id: currentRoom.id, name, color });
  document.getElementById('role-name-input').value = '';
  loadRolesAndMembers();
}

// 通話・画面共有（基本制御）
async function joinCall() {
  document.getElementById('call-panel').classList.remove('hidden');
  inCall = true;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    addVideoBox('me', myProfile.username + ' (自分)', localStream, true);
  } catch (e) {
    addVideoBox('me', myProfile.username + ' (マイク未接続)', null, true);
  }
}

function toggleMute() {
  if (!localStream) return;
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  document.getElementById('mute-btn').textContent = isMuted ? '🔇 解除' : '🎤 ミュート';
}

async function toggleScreenShare() {
  if (screenStream) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    document.getElementById('vid-screen')?.remove();
    return;
  }
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    addVideoBox('screen', '画面共有中', screenStream, true);
  } catch (e) {
    alert('画面共有がキャンセルされたか、この端末ではサポートされていません。');
  }
}

function addVideoBox(id, label, stream, muted) {
  document.getElementById('vid-' + id)?.remove();
  const grid = document.getElementById('video-grid');
  const box = document.createElement('div');
  box.id = 'vid-' + id;
  box.className = 'relative bg-[#2b2d31] rounded-lg overflow-hidden h-28 flex items-center justify-center border border-[#3f4147]';
  if (stream && stream.getVideoTracks().length > 0) {
    const v = document.createElement('video');
    v.srcObject = stream;
    v.autoplay = true;
    v.playsInline = true;
    v.muted = muted;
    v.className = 'w-full h-full object-contain bg-black';
    box.appendChild(v);
  } else {
    box.innerHTML = `<div class="text-xs font-bold text-white">🎙 ${label}</div>`;
  }
  grid.appendChild(box);
}

function leaveCall() {
  inCall = false;
  localStream?.getTracks().forEach(t => t.stop());
  screenStream?.getTracks().forEach(t => t.stop());
  localStream = null;
  screenStream = null;
  document.getElementById('video-grid').innerHTML = '';
  document.getElementById('call-panel').classList.add('hidden');
}
</script>
</body>
